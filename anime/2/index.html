<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omina · 2-mavsum: Birinchi qor</title>
<meta name="description" content="Anime 2-mavsum: Birinchi qor. Olti qism. Bosh rolda — Omina.">
<meta name="theme-color" content="#1B1430">
<meta property="og:title" content="OMINA · 2-mavsum: Birinchi qor ❄️">
<meta property="og:description" content="Olti sovg'a. Bitta sir. Va birinchi qor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Dela+Gothic+One&family=Caveat:wght@500;700&display=swap">
<style>
  :root{
    --matn:"M PLUS Rounded 1c",ui-rounded,"Hiragino Maru Gothic ProN",system-ui,sans-serif;
    --katta:"Dela Gothic One","M PLUS Rounded 1c",Impact,system-ui,sans-serif;
    --pushti:#FF5C8A;
    --pushti-och:#FFD0DE;
    --kok:#4D7CFE;
    --siyoh:#2A2140;
    --oq:#FFFDFB;
    color-scheme:light;
  }
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;overflow:hidden;background:#1B1430}
  body{font-family:var(--matn);color:var(--siyoh);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  button{font-family:inherit}
  button:focus-visible,textarea:focus-visible{outline:3px solid var(--pushti);outline-offset:3px}

  /* ── sahna ─────────────────────────────────── */
  .ekran{position:fixed;inset:0;overflow:hidden;cursor:pointer}
  .fon{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
  .fon.faol{opacity:1}
  .fon svg.shahar{position:absolute;left:0;right:0;bottom:0;width:100%;height:34%;}

  .fon-tong{background:linear-gradient(180deg,#8EC5F2 0%,#BFD9F5 30%,#F8D3E0 62%,#FCE6D6 100%)}
  .fon-tong .shahar{color:#B790B8;opacity:.75}
  .fon-tong .quyosh{position:absolute;left:62%;top:46%;width:150px;height:150px;margin:-75px;border-radius:50%;background:radial-gradient(circle,#FFF6E8 0%,rgba(255,226,200,.75) 35%,rgba(255,210,200,0) 70%)}

  .fon-yomgir{background:linear-gradient(180deg,#38435E 0%,#56627E 50%,#7A8099 100%)}
  .fon-yomgir .shahar{color:#2A3149}
  .fon-yomgir .chiroq{position:absolute;bottom:30%;width:140px;height:140px;margin-left:-70px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,140,.55),rgba(255,214,140,0) 65%)}
  .yomgir-qatlam{position:absolute;inset:-20% -20% 0;
    background-image:repeating-linear-gradient(100deg,rgba(220,232,255,0) 0 18px,rgba(220,232,255,.35) 18px 19px,rgba(220,232,255,0) 19px 46px);
    background-size:120px 220px;animation:yomgir .45s linear infinite}
  .yomgir-qatlam.ikki{background-size:80px 160px;opacity:.6;animation-duration:.32s}
  @keyframes yomgir{to{background-position:-40px 220px}}

  .fon-bayram{background:linear-gradient(180deg,#0A0F2E 0%,#221A4E 55%,#4A2A5E 100%)}
  .fon-bayram .shahar{color:#120D28}
  .fon-tom{background:linear-gradient(180deg,#040918 0%,#0F1C44 55%,#2B3466 80%,#6A4A6E 100%)}
  .fon-tom .shahar{color:#0A1029;height:26%}
  .fon-tom .oy{position:absolute;right:16%;top:12%;width:64px;height:64px;border-radius:50%;background:#FFF6DC;box-shadow:0 0 40px 10px rgba(255,240,200,.35),inset -10px -6px 0 rgba(220,200,160,.35)}
  .fon-tom .panjara{position:absolute;left:0;right:0;bottom:0;height:16%;
    background:linear-gradient(#0A0F22,#0A0F22) 0 0/100% 5px no-repeat,repeating-linear-gradient(90deg,#0A0F22 0 4px,transparent 4px 34px);opacity:.95}
  .fon-oxir{background:linear-gradient(180deg,#5A6BC6 0%,#C88BB8 38%,#FFA98A 66%,#FFD49A 100%)}
  .fon-oxir .shahar{color:#7A4F7E;opacity:.7}
  .fon-oxir .quyosh{position:absolute;left:50%;bottom:28%;width:220px;height:220px;margin-left:-110px;border-radius:50%;background:radial-gradient(circle,#FFF4D6 0%,rgba(255,220,160,.8) 30%,rgba(255,200,150,0) 70%)}


  /* ═══ 2-mavsum: qishki sahnalar ═══ */
  .fon-eshik{background:linear-gradient(180deg,#9FB3CC 0%,#C9D6E6 45%,#E9EEF5 80%,#F5F7FA 100%)}
  .fon-eshik .shahar{color:#8496B0;opacity:.8}
  .fon-eshik .daraxtlar{position:absolute;left:0;right:0;bottom:18%;width:100%;height:auto}
  .fon-muqova{background:linear-gradient(180deg,#0B1430 0%,#22325E 55%,#5C6A9E 85%,#8C93BE 100%)}
  .fon-muqova .shahar{color:#141D3A}
  .fon-muqova .oy{position:absolute;right:14%;top:10%;width:58px;height:58px;border-radius:50%;background:#FFF6DC;box-shadow:0 0 50px 14px rgba(255,240,200,.3),inset -10px -6px 0 rgba(220,200,160,.35)}
  .fon-chorsu{background:linear-gradient(180deg,#8FA2BC 0%,#BCCADB 55%,#E3E9F1 100%)}
  .fon-chorsu .gumbaz{position:absolute;left:50%;bottom:20%;width:min(130vw,640px);transform:translateX(-50%)}
  .fon-minora{background:linear-gradient(180deg,#0F1A36 0%,#25345E 45%,#5A5F8E 72%,#B08AA8 100%)}
  .fon-minora .minora{position:absolute;right:6%;bottom:0;height:88%;width:auto}
  .fon-minora .shahar-chiroq{position:absolute;left:0;right:0;bottom:0;height:30%;background:radial-gradient(circle,#FFD27A 1.1px,transparent 1.8px) 0 0/13px 9px,linear-gradient(transparent,rgba(10,14,30,.85));opacity:.9;
    -webkit-mask:linear-gradient(transparent,#000 40%);mask:linear-gradient(transparent,#000 40%)}
  .fon-chimyon{background:linear-gradient(180deg,#6FA6DD 0%,#A9CBEC 45%,#E6F0FA 100%)}
  .fon-chimyon .toglar{position:absolute;left:0;right:0;bottom:0;width:100%;height:62%}
  .fon-balkon{background:linear-gradient(180deg,#060B1A 0%,#15203D 55%,#2A3558 100%)}
  .fon-balkon .fonar{position:absolute;left:18%;bottom:24%;width:180px;height:180px;margin-left:-90px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,140,.6),rgba(255,214,140,0) 65%)}
  .fon-balkon .bino{position:absolute;right:0;bottom:0;width:46%;height:100%;background:linear-gradient(90deg,#1B2440,#222C4C);box-shadow:-2px 0 0 rgba(255,255,255,.05)}
  .fon-balkon .bino i{position:absolute;left:22%;width:56%;height:16%;background:linear-gradient(#FFCB7A,#E9A64E);border:4px solid #141A30;box-shadow:0 0 40px rgba(255,200,120,.45)}
  .fon-balkon .panjara{position:absolute;right:0;bottom:30%;width:46%;height:10%;background:linear-gradient(#C9D2E6,#C9D2E6) 0 0/100% 4px no-repeat,repeating-linear-gradient(90deg,#C9D2E6 0 3px,transparent 3px 22px);opacity:.75}
  .fon-kelajak{background:linear-gradient(180deg,#1D2A4E 0%,#3B4C7A 60%,#7E8DB5 100%)}
  .fon-kelajak .shahar{color:#16203E}
  .fon-kelajak .rom{position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 0 16px #5A3A22,inset 0 0 0 20px #3E2716,inset 0 0 120px 40px rgba(255,170,90,.45);
    background:linear-gradient(#5A3A22,#5A3A22) 50% 0/12px 100% no-repeat,linear-gradient(#5A3A22,#5A3A22) 0 46%/100% 12px no-repeat}
  .ayoz{position:absolute;inset:0;pointer-events:none;background:
    radial-gradient(60% 40% at 0 0,rgba(255,255,255,.75),rgba(255,255,255,0) 70%),radial-gradient(60% 40% at 100% 0,rgba(255,255,255,.7),rgba(255,255,255,0) 70%),
    radial-gradient(50% 30% at 0 100%,rgba(255,255,255,.55),rgba(255,255,255,0) 70%),radial-gradient(50% 30% at 100% 100%,rgba(255,255,255,.55),rgba(255,255,255,0) 70%)}
  .yer{position:absolute;left:-5%;right:-5%;bottom:0;height:24%;border-radius:50% 50% 0 0/22% 22% 0 0;background:linear-gradient(#FFFFFF,#E3EAF4)}
  .qor{position:absolute;inset:0;pointer-events:none;transition:opacity 2.5s ease}
  .qor.kutmoqda{opacity:0}
  .qor i{position:absolute;top:-12px;border-radius:50%;background:#fff;animation:qorTush linear infinite}
  .qor i.kuchli{display:none}
  .qor.boron i.kuchli{display:block}
  @keyframes qorTush{0%{transform:translate(0,0)}50%{transform:translate(var(--d,20px),55vh)}100%{transform:translate(calc(var(--d,20px) * -.5),112vh)}}

  /* buyumlar va xatlar */
  .buyum-oyna{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;cursor:pointer;
    background:radial-gradient(circle at 50% 45%,rgba(30,40,70,.35),rgba(8,12,26,.78));animation:buyumKir .5s ease both}
  .buyum-oyna.ket{animation:buyumKet .35s ease forwards}
  @keyframes buyumKir{from{opacity:0}}
  @keyframes buyumKet{to{opacity:0}}
  .buyum-oyna svg{width:min(72vw,300px);height:auto;filter:drop-shadow(0 16px 26px rgba(0,0,0,.45));animation:suzish 3s ease-in-out infinite}
  @keyframes suzish{50%{transform:translateY(-8px)}}
  .buyum-izoh{max-width:30ch;margin:0;padding:10px 16px;border-radius:14px;background:rgba(255,253,251,.92);text-align:center;font-weight:700;font-size:clamp(14px,4vw,16px);line-height:1.45;color:var(--siyoh)}
  .xat-qogoz{
    position:relative;width:min(88vw,400px);max-height:76vh;overflow-y:auto;padding:24px 22px 20px;border-radius:4px;transform:rotate(-1.2deg);
    background:#FFFDF6;box-shadow:0 18px 40px rgba(0,0,0,.45);font-family:"Caveat",cursive;font-weight:500;font-size:clamp(21px,6vw,25px);line-height:1.3;color:#24304E;white-space:pre-line;
  }
  .xat-qogoz .imzo{display:block;margin-top:12px;text-align:right;font-weight:700;color:#7A2E3A}
  .xat-qogoz.bola{
    transform:rotate(1.4deg);color:#3C3FA6;font-weight:700;font-size:clamp(18px,5.2vw,24px);line-height:28px;padding:24px 16px 16px 44px;
    background:linear-gradient(90deg,transparent 34px,rgba(220,80,90,.55) 34px 36px,transparent 36px),repeating-linear-gradient(transparent 0 27px,rgba(90,120,200,.35) 27px 28px),#FFFEF8;
  }
  .xat-qogoz.bola::after{content:"♡";position:absolute;right:16px;bottom:8px;font-size:30px;color:#E0607A;transform:rotate(-12deg)}
  .buyum-oyna .bos{margin:0;font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.65)}
  .ism.boshqa{background:linear-gradient(90deg,#5F7A8C,#87A0B0)}
  .ism.nevara{background:linear-gradient(90deg,#C77B4A,#E7A86B)}

  .yulduzlar i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:miltilla 2.4s ease-in-out infinite}
  @keyframes miltilla{50%{opacity:.2}}

  .barglar i{
    position:absolute;top:-30px;width:12px;height:9px;border-radius:12px 0 12px 0;background:linear-gradient(135deg,#FFF 0%,#FFD3E1 70%);
    box-shadow:0 0 2px rgba(255,140,170,.4);animation:barg linear infinite;
  }
  @keyframes barg{
    0%{transform:translate(0,0) rotate(0)}
    50%{transform:translate(-40px,55vh) rotate(200deg)}
    100%{transform:translate(20px,110vh) rotate(420deg)}
  }

  .salyut{position:absolute;width:0;height:0}
  .salyut i{position:absolute;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px var(--r),0 0 16px 4px var(--r);animation:portla 1.6s cubic-bezier(.12,.8,.3,1) forwards}
  @keyframes portla{0%{transform:translate(0,0) scale(1.2);opacity:1}65%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(.5);opacity:0}}

  /* ── effektlar ─────────────────────────────── */
  .ekran.silkin{animation:silkin .45s}
  @keyframes silkin{15%{transform:translate(-9px,4px)}30%{transform:translate(8px,-5px)}45%{transform:translate(-6px,-3px)}60%{transform:translate(5px,4px)}75%{transform:translate(-3px,2px)}}
  .chaqnash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
  .chaqnash.yon{animation:chaqnash .5s ease-out}
  @keyframes chaqnash{0%{opacity:.95}100%{opacity:0}}
  .doki{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(ellipse at center,rgba(255,92,138,0) 45%,rgba(255,92,138,.45) 100%)}
  .doki.yon{animation:doki 1.4s ease-out}
  @keyframes doki{0%,100%{opacity:0}12%{opacity:1}24%{opacity:.35}36%{opacity:1}}
  .doki-yozuv{
    position:absolute;z-index:5;pointer-events:none;font-family:var(--katta);font-size:clamp(22px,7vw,34px);color:var(--pushti);
    -webkit-text-stroke:2px #fff;paint-order:stroke fill;transform:rotate(-12deg);animation:dokiYozuv 1.5s ease-out forwards;
  }
  @keyframes dokiYozuv{0%{opacity:0;transform:rotate(-12deg) scale(.4)}15%{opacity:1;transform:rotate(-12deg) scale(1.15)}30%{transform:rotate(-12deg) scale(.95)}45%{transform:rotate(-12deg) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:rotate(-12deg) translateY(-30px) scale(1)}}
  .porlash i{position:absolute;z-index:4;pointer-events:none;color:#FFF7C2;text-shadow:0 0 8px #FFD86B;animation:porla 1.6s ease-out forwards}
  @keyframes porla{0%{opacity:0;transform:scale(.2) rotate(0)}30%{opacity:1;transform:scale(1.2) rotate(40deg)}100%{opacity:0;transform:scale(.6) rotate(120deg)}}
  .katta-yozuv{
    position:absolute;left:50%;top:34%;z-index:5;pointer-events:none;white-space:nowrap;
    font-family:var(--katta);font-size:clamp(46px,16vw,84px);color:#FFE14D;-webkit-text-stroke:3px var(--siyoh);paint-order:stroke fill;
    animation:taq 1s cubic-bezier(.2,1.6,.4,1) forwards;
  }
  @keyframes taq{0%{transform:translate(-50%,-50%) scale(2.4) rotate(-8deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1) rotate(-8deg);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.05) rotate(-8deg);opacity:0}}
  .tezlik{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;
    background:repeating-conic-gradient(from 0deg at 50% 40%,rgba(255,255,255,0) 0 3deg,rgba(255,255,255,.55) 3deg 4deg,rgba(255,255,255,0) 4deg 9deg);
    -webkit-mask:radial-gradient(circle at 50% 40%,transparent 22%,#000 60%);mask:radial-gradient(circle at 50% 40%,transparent 22%,#000 60%)}
  .tezlik.yon{animation:tezlik .9s ease-out}
  @keyframes tezlik{0%{opacity:1}100%{opacity:0}}
  .hujum{
    position:absolute;left:-10%;right:-10%;top:30%;z-index:5;pointer-events:none;padding:14px 14%;text-align:center;
    background:linear-gradient(90deg,#FF5C8A,#FF9A5C);transform:rotate(-6deg);box-shadow:0 10px 30px rgba(0,0,0,.35);
    animation:hujum 2.2s ease forwards;
  }
  .hujum small{display:block;font-weight:800;font-size:12px;letter-spacing:.3em;color:#FFE6EE}
  .hujum b{display:block;font-family:var(--katta);font-weight:400;font-size:clamp(20px,6.5vw,32px);line-height:1.15;color:#fff;-webkit-text-stroke:1px rgba(42,33,64,.4)}
  @keyframes hujum{0%{transform:rotate(-6deg) translateX(110%)}15%,80%{transform:rotate(-6deg) translateX(0)}100%{transform:rotate(-6deg) translateX(-110%)}}

  /* ── yuqori panel ──────────────────────────── */
  .panel{
    position:absolute;z-index:7;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;pointer-events:none;
  }
  .qism-nomi{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.75);font-weight:800;font-size:12px;letter-spacing:.06em;color:var(--siyoh);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .yurak-olchov{display:flex;align-items:center;gap:3px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:15px;line-height:1}
  .yurak-olchov span{color:#E3CCD5;transition:color .4s,transform .4s}
  .yurak-olchov span.tol{color:var(--pushti)}
  .yurak-olchov span.yangi{animation:yurakYangi .7s ease}
  @keyframes yurakYangi{40%{transform:scale(1.8)}}

  /* ── dialog ────────────────────────────────── */
  .dialog{
    position:absolute;z-index:7;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));
    max-width:640px;margin:0 auto;min-height:150px;padding:26px 20px 30px;border-radius:20px;
    background:rgba(255,253,251,.9);border:2px solid #fff;box-shadow:0 16px 40px -12px rgba(30,10,40,.55),inset 0 0 0 1px rgba(255,92,138,.2);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .3s, transform .3s;
  }
  .dialog.yashirin{opacity:0;transform:translateY(20px);pointer-events:none}
  .ism{
    position:absolute;left:16px;top:-16px;padding:5px 16px;border-radius:999px;font-weight:800;font-size:14px;letter-spacing:.04em;color:#fff;
    background:var(--kok);box-shadow:0 4px 12px -4px rgba(0,0,0,.35);
  }
  .ism.ramz{background:linear-gradient(90deg,#4D7CFE,#6C5CE7)}
  .ism.omina{background:linear-gradient(90deg,#FF5C8A,#FF8FB1)}
  .ism.ichki{background:linear-gradient(90deg,#8E7CC3,#B39DDB)}
  .gap{margin:0;min-height:3.2em;font-weight:500;font-size:clamp(16px,4.4vw,19px);line-height:1.6;white-space:pre-line}
  .gap.hikoya{font-style:italic;color:#5A4E70}
  .gap.ichki-ovoz{color:#5B4A8C}
  .gap .ajrat{color:var(--pushti);font-weight:800}
  .davom{position:absolute;right:18px;bottom:10px;color:var(--pushti);font-size:14px;animation:sakra 1s ease-in-out infinite;opacity:0}
  .davom.bor{opacity:1}
  @keyframes sakra{50%{transform:translateY(4px)}}


  /* ── personajlar ───────────────────────────── */
  .personajlar{position:absolute;inset:0;z-index:2;pointer-events:none}
  .personaj{
    position:absolute;bottom:calc(118px + env(safe-area-inset-bottom,0px));width:min(60vw,320px);
    opacity:0;transform:translateY(30px);transition:opacity .5s ease,transform .5s ease,filter .3s ease;
  }
  .personaj svg{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 14px rgba(20,10,30,.35))}
  .personaj.ramz{left:max(-4vw,-18px)}
  .personaj.omina{right:max(-4vw,-18px)}
  .personaj.bor{opacity:1;transform:none}
  .personaj.bor.xira{filter:brightness(.7) saturate(.75);transform:translateY(10px) scale(.97)}
  .personaj.bor.sakra{animation:sakra2 .35s ease}
  @keyframes sakra2{40%{transform:translateY(-8px)}}

  .tanlovlar{
    position:absolute;z-index:8;left:16px;right:16px;bottom:calc(30px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;
    display:grid;gap:10px;
  }
  .tanlovlar p{margin:0 0 2px;text-align:center;font-weight:800;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .tanlovlar button{
    width:100%;min-height:54px;padding:12px 18px;border-radius:16px;border:2px solid #fff;cursor:pointer;text-align:left;
    background:rgba(255,253,251,.92);font-weight:700;font-size:clamp(15px,4.2vw,17px);line-height:1.35;color:var(--siyoh);
    box-shadow:0 8px 20px -10px rgba(30,10,40,.6);animation:tanlovChiq .4s ease both;transition:transform .15s,background .15s;
  }
  .tanlovlar button:nth-of-type(2){animation-delay:.08s}
  .tanlovlar button:nth-of-type(3){animation-delay:.16s}
  .tanlovlar button::before{content:"♡";margin-right:10px;color:var(--pushti)}
  .tanlovlar button:active{transform:scale(.97);background:var(--pushti-och)}
  @keyframes tanlovChiq{from{opacity:0;transform:translateY(16px)}}

  /* ── qism kartasi ──────────────────────────── */
  .karta{
    position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
    background:linear-gradient(115deg,#1B1430 0 14%,#FF5C8A 14% 16%,#1B1430 16% 84%,#FF5C8A 84% 86%,#1B1430 86%);color:#fff;animation:kartaKir .6s ease both;
  }
  .karta.ket{animation:kartaKet .5s ease forwards}
  @keyframes kartaKir{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes kartaKet{to{opacity:0;transform:scale(1.06)}}
  .karta small{font-weight:800;font-size:13px;letter-spacing:.4em;color:var(--pushti)}
  .karta h2{margin:0;padding:0 20px;font-family:var(--katta);font-weight:400;font-size:clamp(32px,10vw,56px);line-height:1.1;text-shadow:4px 4px 0 var(--pushti)}
  .karta span{font-weight:700;font-size:13px;letter-spacing:.2em;color:rgba(255,255,255,.55)}

  /* ── bosh ekran ────────────────────────────── */
  .bosh{
    position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;cursor:default;
    background:linear-gradient(180deg,rgba(27,20,48,.15),rgba(27,20,48,.55));
  }
  .bosh .kichik{margin:0;font-weight:800;font-size:12px;letter-spacing:.4em;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.4)}
  .bosh h1{margin:0;font-family:var(--katta);font-weight:400;font-size:clamp(52px,17vw,110px);line-height:.95;color:#fff;-webkit-text-stroke:3px var(--pushti);paint-order:stroke fill;text-shadow:6px 6px 0 rgba(255,92,138,.55)}
  .bosh .ost{margin:0;font-weight:800;font-size:clamp(15px,4.4vw,19px);color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.45)}
  .bosh .ogoh{max-width:30ch;margin:6px 0 10px;font-weight:500;font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.92);text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .katta-tugma{
    min-width:220px;min-height:54px;padding:12px 26px;border-radius:999px;border:3px solid #fff;cursor:pointer;
    background:linear-gradient(90deg,#FF5C8A,#FF8F6B);font-weight:800;font-size:17px;letter-spacing:.06em;color:#fff;box-shadow:0 10px 26px -8px rgba(255,92,138,.8);
  }
  .oddiy-tugma{min-height:46px;padding:10px 22px;border-radius:999px;border:2px solid rgba(255,255,255,.8);background:rgba(255,255,255,.18);cursor:pointer;font-weight:800;font-size:14px;color:#fff;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}

  /* ── titrlar va oxirgi so'z ────────────────── */
  .titr{position:absolute;inset:0;z-index:9;overflow:hidden;background:rgba(15,10,30,.72);color:#fff;text-align:center;cursor:default}
  .titr-lenta{position:absolute;left:0;right:0;top:100%;padding:0 24px;animation:titr 26s linear forwards}
  @keyframes titr{to{transform:translateY(calc(-100% - 100vh))}}
  .titr-lenta h2{margin:0 0 6px;font-family:var(--katta);font-weight:400;font-size:48px;color:#fff;-webkit-text-stroke:2px var(--pushti);paint-order:stroke fill}
  .titr-lenta .ost{margin:0 0 50px;font-weight:700;color:var(--pushti-och)}
  .titr-lenta dl{margin:0 0 40px}
  .titr-lenta dt{font-weight:700;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.55)}
  .titr-lenta dd{margin:4px 0 26px;font-weight:800;font-size:20px}
  .titr-lenta .keyingi{margin:60px 0 0;font-family:var(--katta);font-size:22px;color:#FFE14D}
  .otkaz{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:2}

  .songi{
    position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;cursor:default;
    background:linear-gradient(180deg,rgba(27,20,48,.35),rgba(27,20,48,.75));color:#fff;
  }
  .songi h2{margin:0;font-family:var(--katta);font-weight:400;font-size:clamp(30px,9vw,44px);line-height:1.1;text-shadow:3px 3px 0 var(--pushti)}
  .songi .natija{margin:0;font-weight:800;font-size:16px;color:var(--pushti-och)}
  .songi .izoh{max-width:32ch;margin:0;font-weight:500;font-size:14px;line-height:1.5;color:rgba(255,255,255,.85)}
  .songi textarea{
    width:min(100%,420px);min-height:96px;padding:12px 14px;border-radius:14px;border:2px solid #fff;resize:vertical;
    font-family:var(--matn);font-size:16px;line-height:1.5;color:var(--siyoh);background:rgba(255,253,251,.95);user-select:text;-webkit-user-select:text;
  }
  .songi .holat{min-height:1.4em;margin:0;font-weight:700;font-size:14px;color:#FFE14D}
  .songi .qator{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

  @media (prefers-reduced-motion:reduce){
    .barglar,.yomgir-qatlam{display:none}
    .ekran.silkin{animation:none}
    .titr-lenta{animation-duration:60s}
  }
</style>
</head>

<script>
(function(){
  "use strict";

  /* ═══════════════════════════════════════════════
     SSENARIY. Har bir qator:
       {s:"fon"}                       — sahnani almashtiradi (eshik, chorsu, minora, chimyon, balkon, kelajak)
       {buyum:"nom", m:"izoh"}         — buyumni katta ko'rsatadi (muz, shar, chana, qordanOdam)
       {xat:"matn", imzo, tur:"bola"}  — xat varag'i; bosilsa davom etadi
       ko / e / keksa / sharf          — kim sahnada, qanday ifodada, keksami, Ramzda sharf bormi
       {karta:"1-QISM", nom:"..."}     — qism boshidagi karta
       {k:"h|r|o|i|x|n", m, nom, fx}   — gap: h — hikoyachi, r — Ramz, o — Omina, i — ichki ovoz, x — boshqa odam, n — nevara; nom — ism yorlig'ini almashtiradi
       {tanlov:[{t:"...", keyin:[...]}]} — tanlov; har biri yurakni bitta to'ldiradi
       {titr:true}                     — oxirgi titrlar
     Effektlar (fx): doki, silkin, chaqnash, porla, taq, hujum, zarba — bo'sh joy bilan bir nechtasi.
  ═══════════════════════════════════════════════ */
  var ISM = "Omina", MUALLIF = "Ramz";
  var POCHTA = "/pochta/javob";

  var SSENARIY = [
    {s:"eshik"},
    {karta:"1-QISM", nom:"Imzosiz xat"},
    {k:"h", m:"Bu voqea o'sha qishda boshlangan. Toshkentga hali qor tushmagan edi, lekin havo allaqachon uni kutardi."},
    {k:"h", m:"Bir kuni ertalab Omina eshikni ochdi. Ostonada esa... muz bo'lagi turardi.", ko:"o", e:"o:hayron"},
    {buyum:"muz", m:"Muz ichida — buklangan xat."},
    {xat:"Qish boshlandi.\nSeni oltita sovg'a kutyapti. Birinchisi allaqachon qo'lingda.\nIkkinchisi — Chorsuda.\nShoshilma: hammasi o'z vaqtida.", imzo:"— Qorbobo emas"},
    {k:"o", m:"«Qorbobo emas»?.. Bu qanaqa hazil?", e:"o:hayron"},
    {k:"h", m:"U darrov Ramzga video qo'ng'iroq qildi. Ramz Andijonda, bozorning qoq o'rtasida ekan.", ko:"ro", e:"r:oddiy o:hayron", fx:"dzz"},
    {k:"r", nom:"Ramz · video", m:"Qanaqa xat? Qorbobo emas?! Hm. Men uni topaman. Topib, Andijoncha gaplashaman.", e:"r:hayron"},
    {k:"o", m:"Rashk qilyapsanmi?", e:"o:kulgan"},
    {k:"r", nom:"Ramz · video", m:"Yo'q. Shunchaki... Toshkentda senga xat yozadigan mendan boshqa odam bo'lmasligi kerak.", e:"r:qizargan"},
    {tanlov:[
      {t:"«Balki u sendan chiroyliroq yozar?»", keyin:[
        {k:"r", nom:"Ramz · video", m:"Imkonsiz. Sen haqingda chiroyli yozish oson — sen o'zing chiroylisan. Lekin eng chiroylisini baribir men yozaman.", e:"r:kulgan o:kulgan"}
      ]},
      {t:"«Xavotir olma, sen — yagonasan»", keyin:[
        {k:"r", nom:"Ramz · video", m:"Shuni yozib, imzolab ber. Muzlatib, umrbod saqlayman.", e:"r:qizargan o:kulgan", fx:"doki"}
      ]},
      {t:"(Kulib, telefonni qo'yish)", keyin:[
        {k:"h", m:"Omina kulib telefonni qo'ydi. Ekranda Ramzning hayron yuzi qotib qoldi.", e:"r:hayron o:kulgan"}
      ]}
    ]},
    {k:"h", m:"Faqat bir narsa g'alati edi: xatdagi yozuv hech kimnikiga o'xshamasdi. Go'yo kimdir ataylab chap qo'li bilan yozgandek.", e:"o:oddiy"},

    {s:"chorsu"},
    {karta:"2-QISM", nom:"Shar ichidagi uy"},
    {k:"h", m:"Chorsu. Gumbaz ustida birinchi qirov. Bozor shovqini, issiq non hidi."},
    {k:"h", m:"Burchakdagi kichkina do'konda keksa usta Ominani kutib turardi — go'yo uni ko'p yillardan beri tanigandek.", ko:"o", e:"o:hayron"},
    {k:"x", nom:"Keksa usta", m:"Siz Omina qizimmisiz? Sizga omonat qoldirishgan."},
    {buyum:"shar", m:"Qor shari. Ichida — kichkina uy, tut daraxti va ko'k darvoza."},
    {k:"o", m:"Bu... bu bizning uyimiz-ku. Bolaligimdagi. Tut daraxti ham, ko'k darvoza ham...", e:"o:hayron", fx:"porla"},
    {k:"h", m:"Omina sharni silkitdi. Ichida qor aylandi. Tut daraxti ortida esa juda kichkina kimdir turardi — yumaloq ko'zoynakli."},
    {k:"h", m:"Lekin Omina buni sezmadi. Uning ko'zlari namlangan edi.", e:"o:qizargan"},
    {k:"x", nom:"Keksa usta", m:"Uni buyurtma qilgan yigit tayinladi: «Agar yig'lasa, aytib qo'ying — bu faqat xursandchilikdan bo'lsin»."},
    {k:"o", m:"Qanaqa yigit? U qanaqa edi?", e:"o:hayron"},
    {k:"x", nom:"Keksa usta", m:"Eh, qizim, keksa ko'zim nimani ham ko'rardi. Faqat... sizni gapirganda ko'zlari kulib turardi.", e:"o:qizargan"},
    {tanlov:[
      {t:"Ramzga yozish: «Bu senmisan?»", keyin:[
        {k:"h", m:"Javob darrov keldi — Andijondagi choyxonadan rasm: «Men bu yerda palov yeyapman. Qorbobo emasga salom ayt».", e:"o:hayron"}
      ]},
      {t:"Sharni yuragiga bosish", keyin:[
        {k:"h", m:"Omina sharni yuragiga bosdi. Shisha sovuq edi, lekin negadir ichi iliq bo'lib ketdi.", e:"o:qizargan", fx:"doki"}
      ]},
      {t:"Ustadan yana so'rash", keyin:[
        {k:"x", nom:"Keksa usta", m:"Bir narsani ayta olaman: u bu sharni bir oy yasatdi. Uyni uch marta qayta qildirdi. «Darvoza aynan shu ko'k rangda bo'lsin», dedi.", e:"o:hayron"}
      ]}
    ]},
    {k:"h", m:"Shar tagida ikkinchi xat yashiringan edi."},
    {xat:"Bolaligingdagi uy hech qachon yo'qolmaydi.\nEndi u sening kaftingda.\nUchinchi sovg'a — shaharning eng tepasida.\nKechqurun, soat yettida.", imzo:"— Qorbobo emas"},

    {s:"minora"},
    {karta:"3-QISM", nom:"Shahar tepasida"},
    {k:"h", m:"Teleminora. Kechki yetti. Pastda butun Toshkent — chiroqlar, yo'llar, minglab derazalar."},
    {k:"h", m:"Ko'rish maydonchasi bo'm-bo'sh edi. Faqat oynaga yopishtirilgan konvert.", ko:"o", e:"o:hayron"},
    {xat:"Sen bolaligingda shaharni eng tepadan ko'rishni orzu qilgansan.\nMana u — oyog'ing ostida.\nYana bilib qo'y: bu yerdan ko'rinadigan eng chiroyli manzara — oynada aks etib turgan qiz.", imzo:"— Qorbobo emas"},
    {k:"h", m:"Omina oynaga qaradi. Shahar chiroqlari ustida — o'zining aksi.", e:"o:qizargan", fx:"porla"},
    {k:"o", m:"Bu albatta Ramz. Boshqa hech kim menga bunaqa gap yozmaydi.", e:"o:oddiy"},
    {k:"h", m:"U yana qo'ng'iroq qildi.", ko:"ro", e:"r:oddiy o:oddiy", fx:"dzz"},
    {k:"r", nom:"Ramz · video", m:"Andijondaman, ishon! Mana bugungi gazeta, mana sana, mana qo'shni do'kondagi Mahmud aka.", e:"r:hayron"},
    {k:"o", m:"Unda kim? Kim mening bolaligimni bunchalik yaxshi biladi?", e:"o:hayron"},
    {k:"r", nom:"Ramz · video", m:"Bilmadim. Lekin uni tushunaman. Seni bir marta ko'rgan odam ham butun umr sen haqingda o'ylab yurishi mumkin.", e:"r:qizargan", fx:"doki"},
    {tanlov:[
      {t:"«Sen ham shunaqa o'ylaysanmi?»", keyin:[
        {k:"r", nom:"Ramz · video", m:"Men o'ylamayman. Men shunchaki eslab yuraman. Har daqiqa.", e:"r:qizargan o:qizargan", fx:"doki"}
      ]},
      {t:"«Ehtiyot bo'l, Qorbobo emas sendan o'zib ketyapti»", keyin:[
        {k:"r", nom:"Ramz · video", m:"O'yin hali tugamadi. Andijonliklar oxirgi raundda yutadi.", e:"r:kulgan o:kulgan"}
      ]},
      {t:"(Jim turib, shaharga qarash)", keyin:[
        {k:"h", m:"Ikkalasi bir daqiqa jim qolishdi. Bir tomonda Toshkent chiroqlari, bir tomonda telefondagi Andijon. Masofa birdan qisqarib qoldi.", e:"r:kulgan o:kulgan"}
      ]}
    ]},
    {k:"h", m:"Konvertda yana bir varaq bor edi: «To'rtinchi sovg'a — Chimyonda. Shanba ertalab. Issiq kiyin»."},

    {s:"chimyon"},
    {karta:"4-QISM", nom:"Kulayotgan qordan odam"},
    {k:"h", m:"Chimyon. Tog'lar oppoq. Havo shunchalik toza ediki, nafas olish ham shirin edi."},
    {k:"h", m:"Qiyalik tepasida chana turardi.", ko:"o", e:"o:hayron"},
    {buyum:"chana", m:"Chana yonida yozuv: «Hech kim shoshiltirmaydi. Xohlagancha uch»."},
    {k:"o", m:"Bolaligimda dadam doim «bo'ldi, ketdik» derdi... Bugun hech kim demaydi.", e:"o:kulgan", fx:"porla"},
    {k:"h", m:"Omina uchdi. Bir marta, ikki marta, o'n marta. Kulgisi butun tog'ga yoyildi.", e:"o:kulgan", fx:"porla"},
    {k:"h", m:"Pastda uni qordan odam kutib turardi — kulib turgan, sabzi burunli."},
    {buyum:"qordanOdam", m:"Qordan odamning bo'ynida — ko'k-kulrang yo'l-yo'l sharf."},
    {k:"o", m:"To'xta... Bu sharf... Bu Ramzning sharfi-ku!", e:"o:hayron", fx:"hayrat silkin"},
    {k:"h", m:"U qaltirab turib qo'ng'iroq qildi.", ko:"ro", e:"r:oddiy o:hayron", fx:"dzz"},
    {k:"r", nom:"Ramz · video", m:"Sharfim? Uni Andijonda, bozorda yo'qotib qo'ygandim-ku! Qanaqasiga...", e:"r:hayron"},
    {k:"r", nom:"Ramz · video", m:"...Omina. Bir yomon yangilik bor. Qor sababli dovon yopildi. Juma kuni kelolmayman.", e:"r:oddiy o:hayron"},
    {k:"h", m:"Ob-havo esa juma kechasiga Toshkentda yilning birinchi qorini va'da qilayotgan edi.", e:"o:qizargan"},
    {tanlov:[
      {t:"«Mayli. Muhimi — sen yo'lda xavfsiz bo'l»", keyin:[
        {k:"r", nom:"Ramz · video", m:"Sen shunaqa deysan-u, men seni yana bir marta sevib qolaman. Bu adolatdan emas.", e:"r:qizargan o:kulgan", fx:"doki"}
      ]},
      {t:"«Birinchi qorda birga bo'lishimiz kerak edi...»", keyin:[
        {k:"r", nom:"Ramz · video", m:"Afsonalarni men yozmaganman. Lekin ularni buzishga ham hech kimga ruxsat bermayman.", e:"r:oddiy o:qizargan"}

  var buyumOyna = null;

    if (q.xat != null){
      var x = el("div", "xat-qogoz" + (q.tur ? " " + q.tur : ""), ismQoy(q.xat));
      if (q.imzo) x.appendChild(el("span", "imzo", ismQoy(q.imzo)));

      $("ekranOquvchi").textContent = ismQoy(q.xat) + (q.imzo ? " " + q.imzo : "");
    } else {
      var w = el("div"); w.innerHTML = BUYUM[q.buyum] || "";

    }

    o.addEventListener("click", function(e){ e.stopPropagation(); buyumYop(); });
  }
  function buyumYop(){
    var o = buyumOyna;
    if (!o || o.classList.contains("ket")) return;
    o.classList.add("ket");
    setTimeout(function(){ o.remove(); buyumOyna = null; holat = "kutyapti"; keyingi(); }, 330);

  /* ── qism kartasi ─────────────────────────── */
  function kartaKorsat(q){
    holat = "karta";
    dialog.classList.add("yashirin");
    var k = el("div", "karta");
    k.appendChild(el("small", "", q.karta));
    k.appendChild(el("h2", "", q.nom));
    k.appendChild(el("span", "", "OMINA · 2-mavsum · Birinchi qor"));
    ekran.appendChild(k);
    var ketdi = false;
    function ket(){
      if (ketdi) return; ketdi = true;
      k.classList.add("ket");
      setTimeout(function(){ k.remove(); holat = "kutyapti"; keyingi(); }, 450);
    }
    k.addEventListener("click", function(e){ e.stopPropagation(); ket(); });
    setTimeout(ket, 2400);
  }

  /* ── asosiy oqim ──────────────────────────── */
  function keyingi(){
    var q = ichki.length ? ichki.shift() : SSENARIY[qadam++];
    if (!q) return;
    saqlash();
    if (q.s){ fonQoy(q.s); personajlarniTozala(); keyingi(); return; }
    if (q.karta){ kartaKorsat(q); return; }
    if (q.buyum || q.xat != null){ buyumKorsat(q); return; }
    if (q.tanlov){ tanlovKorsat(q); return; }
    if (q.titr){ titrlar(); return; }
    personajlarniYangila(q);
    gapKorsat(q);
  }
  function bos(){
    if (holat === "yozyapti") yozishTugat();
    else if (holat === "kutyapti") keyingi();
    else if (holat === "buyum") buyumYop();
  }
  ekran.addEventListener("click", function(e){
    if (e.target.closest("button, textarea, a, .bosh, .titr, .songi, .buyum-oyna")) return;
    bos();
  });
  window.addEventListener("keydown", function(e){
    if (e.target.closest && e.target.closest("textarea, button")) return;
    if (e.key === " " || e.key === "Enter" || e.key === "ArrowRight"){ e.preventDefault(); bos(); }
  });

  function boshla(boshidan){
    var s = boshidan ? null : oqish();
    qadam = s && s.qadam ? s.qadam : 0;

    ichki = [];
    $("bosh").hidden = true;
    $("panel").hidden = false;

    holat = "kutyapti";

     ["Alohida minnatdorchilik", "Yetti yoshli " + ISM + "ga"]].forEach(function(q){
      dl.appendChild(el("dt", "", q[0])); dl.appendChild(el("dd", "", q[1]));

    t.appendChild(otkaz);
    ekran.appendChild(t);
    var tugadi = false;
    function songiga(){ if (tugadi) return; tugadi = true; t.remove(); songi(); }
    otkaz.addEventListener("click", function(e){ e.stopPropagation(); songiga(); });
    l.addEventListener("animationend", songiga);

  function songi(){
    holat = "songi";

    var s = el("div", "songi");

      if (yuborildi) return;
      yubor.disabled = true; hol.textContent = "Yuborilyapti…";
      fetch(POCHTA, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({savol: "Anime 2-mavsum «Birinchi qor» oxirida (yurak " + yurak + "/" + YURAK_JAMI + ")", javob: matn})
      }).then(function(j){
        if (!j.ok) throw new Error(String(j.status));
        yuborildi = true;
        hol.textContent = MUALLIF + " oldi ✓";
        ta.disabled = true; yubor.textContent = "Yuborildi ♥";
      }).catch(function(){
        yubor.disabled = false;
        hol.textContent = "Yuborilmadi. Internetni tekshirib, qayta bos.";
      });
    });
    qayta.addEventListener("click", function(e){
      e.stopPropagation();
      s.remove();
      fon = null; fonQoy("muqova");
      boshla(true);
    });
  }

  /* ── boshlanish ───────────────────────────── */
  fonQoy("muqova");
  $("panel").hidden = true;
  var saqlangan = oqish();
  if (saqlangan && saqlangan.qadam > 0){ $("davomEt").hidden = false; $("boshla").textContent = "▶ Boshidan"; }
})();
