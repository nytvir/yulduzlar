<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OMINA · 1-bob</title>
<meta name="description" content="Omina haqida manga. 1-bob: Ikki shahar orasida.">
<meta name="theme-color" content="#1A1A1A">
<meta property="og:title" content="OMINA — manga, 1-bob 📖">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
  :root{
    --qora:#141217;
    --qogoz:#FBFAF6;
    --pufak:"Comic Neue","Comic Sans MS",ui-rounded,system-ui,sans-serif;
    --sfx:"Bangers",Impact,system-ui,sans-serif;
    --nom:"Dela Gothic One",Impact,system-ui,sans-serif;
    --oddiy:"M PLUS Rounded 1c",system-ui,sans-serif;
    --nuqta:radial-gradient(circle,var(--qora) 0.9px,transparent 1.3px) 0 0/5px 5px;
    --nuqta-qalin:radial-gradient(circle,var(--qora) 1.3px,transparent 1.7px) 0 0/4.5px 4.5px;
    color-scheme:light;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{background:#1A1A1A}
  body{margin:0;min-height:100vh;color:var(--qora);font-family:var(--oddiy);-webkit-font-smoothing:antialiased;
    background:radial-gradient(120% 60% at 50% 0%,#2E2E2E,#1A1A1A 70%) fixed}
  main{display:flex;flex-direction:column;align-items:center;gap:22px;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(40px + env(safe-area-inset-bottom,0px))}
  .tepa{width:min(100%,560px);display:flex;justify-content:space-between;align-items:center;color:rgba(255,255,255,.6);font-weight:800;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
  .tepa a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3)}

  /* ── sahifa ────────────────────────────────── */
  .bet{
    position:relative;width:min(100%,560px);aspect-ratio:1/1.5;padding:12px 12px 26px;background:var(--qogoz);
    display:grid;gap:8px;box-shadow:0 18px 40px -16px rgba(0,0,0,.8);
  }
  .bet-raqam{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--pufak);font-size:11px;color:#666}
  .kadr{position:relative;overflow:hidden;border:2.5px solid var(--qora);background:#fff;min-height:0}
  .kadr > *{position:absolute}

  /* fonlar */
  .f-nuqta{inset:0;background:var(--nuqta);opacity:.55}
  .f-nuqta-past{inset:0;background:var(--nuqta);-webkit-mask:linear-gradient(transparent 20%,#000 100%);mask:linear-gradient(transparent 20%,#000 100%);opacity:.7}
  .f-nuqta-tepa{inset:0;background:var(--nuqta-qalin);-webkit-mask:linear-gradient(#000,transparent 75%);mask:linear-gradient(#000,transparent 75%);opacity:.6}
  .f-qora{inset:0;background:var(--qora)}
  .f-tezlik{inset:-20%;background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0 2.2deg,var(--qora) 2.2deg 2.8deg,transparent 2.8deg 6deg);
    -webkit-mask:radial-gradient(circle at 50% 50%,transparent 18%,#000 55%);mask:radial-gradient(circle at 50% 50%,transparent 18%,#000 55%)}
  .f-tezlik.oq{background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0 2.2deg,#fff 2.2deg 2.8deg,transparent 2.8deg 6deg)}
  .f-yomgir{inset:-10%;background:repeating-linear-gradient(105deg,transparent 0 11px,rgba(20,18,23,.75) 11px 12.2px,transparent 12.2px 26px)}
  .f-yomgir.oq{background:repeating-linear-gradient(105deg,transparent 0 11px,rgba(255,255,255,.9) 11px 12.2px,transparent 12.2px 26px)}
  .f-yulduz{inset:0}
  .f-yulduz i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff}
  .shahar{left:0;right:0;bottom:0;width:100%;height:46%}
  .barg{width:14px;height:10px;border:1.5px solid var(--qora);background:#fff;border-radius:14px 0 14px 0}
  .yaltir{font-size:18px;line-height:1;color:var(--qora)}
  .yaltir.oq{color:#fff;text-shadow:0 0 6px #fff}

  /* personaj */
  .pj svg{display:block;height:100%;width:auto}

  /* pufakchalar */
  .pufak{
    z-index:3;display:grid;place-items:center;padding:8px 12px;text-align:center;background:#fff;border:2px solid var(--qora);border-radius:50%;
    font-family:var(--pufak);font-weight:700;font-size:clamp(10.5px,3.1vw,14px);line-height:1.18;color:var(--qora);
  }
  .pufak::after{content:"";position:absolute;width:14px;height:14px;background:#fff;border:2px solid var(--qora);border-top:none;border-left:none}
  .pufak.d-past::after{bottom:-8px;left:42%;transform:rotate(45deg) skew(12deg,12deg)}
  .pufak.d-chap::after{left:-8px;top:52%;transform:rotate(135deg) skew(12deg,12deg)}
  .pufak.d-ong::after{right:-8px;top:52%;transform:rotate(-45deg) skew(12deg,12deg)}
  .pufak.d-yoq::after{display:none}
  .pufak.oy{border-style:solid;border-radius:45%;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--qora)}
  .pufak.oy::after{display:none}
  .pufak.baqir{border-radius:8px;clip-path:polygon(0 12%,8% 0,18% 10%,30% 0,42% 9%,55% 0,66% 10%,78% 0,88% 11%,100% 4%,94% 30%,100% 50%,93% 70%,100% 92%,86% 88%,74% 100%,62% 90%,50% 100%,38% 90%,26% 100%,14% 89%,0 96%,6% 70%,0 50%,7% 30%);padding:16px 18px;border-width:0;background:#fff;outline:none;
    filter:drop-shadow(0 0 0 var(--qora)) drop-shadow(2px 0 0 var(--qora)) drop-shadow(-2px 0 0 var(--qora)) drop-shadow(0 2px 0 var(--qora)) drop-shadow(0 -2px 0 var(--qora))}
  .pufak.baqir::after{display:none}
  .hikoya{
    z-index:3;padding:6px 8px;background:#fff;border:2px solid var(--qora);
    font-family:var(--pufak);font-weight:700;font-size:clamp(10px,2.9vw,13px);line-height:1.2;
  }
  .hikoya.qora{background:var(--qora);color:#fff;border-color:#fff}

  /* tovush yozuvlari */
  .sfx{
    z-index:4;font-family:var(--sfx);line-height:.9;letter-spacing:.02em;color:var(--qora);white-space:nowrap;
    -webkit-text-stroke:5px #fff;paint-order:stroke fill;
  }
  .sfx.oq{color:#fff;-webkit-text-stroke:5px var(--qora)}
  .sfx.kichik{font-family:var(--pufak);font-weight:700;-webkit-text-stroke:3px #fff}

  /* muqova */
  .bet.muqova{padding:12px}
  .muqova .kadr{border-width:3px}
  .muqova-nom{z-index:5;left:0;right:0;top:5%;text-align:center}
  .muqova-nom h1{margin:0;font-family:var(--nom);font-weight:400;font-size:clamp(48px,15.5vw,90px);line-height:.9;color:var(--qora);-webkit-text-stroke:6px #fff;paint-order:stroke fill}
  .muqova-nom p{display:inline-block;margin:8px 0 0;padding:4px 12px;background:var(--qora);color:#fff;font-weight:800;font-size:clamp(11px,3.2vw,14px);letter-spacing:.14em}
  .muqova-muallif{z-index:5;right:4%;bottom:3%;padding:4px 10px;background:#fff;border:2px solid var(--qora);font-family:var(--pufak);font-weight:700;font-size:13px}
  .muqova-raqam{z-index:5;left:4%;bottom:3%;font-family:var(--nom);font-size:40px;line-height:1;color:#fff;-webkit-text-stroke:3px var(--qora);paint-order:stroke fill}

  /* oxiri */
  .oxir{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
  .oxir h2{margin:0;font-family:var(--nom);font-weight:400;font-size:clamp(34px,11vw,56px);line-height:1}
  .oxir p{margin:0;font-family:var(--pufak);font-weight:700;font-size:16px}
  .oxir .tugmalar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
  .oxir a{display:inline-block;padding:10px 18px;border:2.5px solid var(--qora);background:#fff;color:var(--qora);text-decoration:none;font-weight:800;font-size:14px;box-shadow:3px 3px 0 var(--qora)}
</style>
</head>
<body>
<main id="kitob">

<script>
(function(){
  "use strict";
  var ISM = "Omina", MUALLIF = "Ramz";

  /* ── personajlar: oq-qora manga ─────────────── */
  var INK = "#141217";
  var PERSONAJ = {
    o: {ayol: true, kozY: 210, m: 1.15},
    r: {ayol: false, kozY: 208, m: 1.06}
  };
  var sanoq = 0;

  function koz(id, x, y, m, chap, p, holat){
    var t = "translate(" + x + " " + y + ") scale(" + (chap ? m : -m) + " " + m + ")";
    var lash = p.ayol ? 4.8 : 4;
    if (holat === "kulgan"){
      return '<g transform="' + t + '"><path d="M-19 6 Q0 -14 19 6" fill="none" stroke="' + INK + '" stroke-width="' + lash + '" stroke-linecap="round"/>' +
        (p.ayol ? '<path d="M-19 6 L-26 1" stroke="' + INK + '" stroke-width="2.5" stroke-linecap="round"/>' : '') + '</g>';
    }
    var oq = "M-21 -8 Q-2 -24 20 -12 Q19 14 0 19 Q-19 14 -21 -8 Z";
    var hayron = holat === "hayron", uyal = holat === "qizargan";
    var dx = uyal ? (chap ? -5 : 5) : 0;
    var rx = hayron ? 11 : 12, ry = hayron ? 14 : 16;
    var g = '<g transform="' + t + '">' +
      '<clipPath id="' + id + 'k"><path d="' + oq + '"/></clipPath>' +
      '<path d="' + oq + '" fill="#FFFFFF"/>' +
      '<g clip-path="url(#' + id + 'k)">' +
        '<ellipse cx="' + (1 + dx) + '" cy="2" rx="' + rx + '" ry="' + ry + '" fill="url(#' + id.slice(0, -1) + 'i)" stroke="' + INK + '" stroke-width="1.4"/>' +
        '<ellipse cx="' + (1 + dx) + '" cy="4" rx="' + (hayron ? 3 : 5.5) + '" ry="' + (hayron ? 4 : 8) + '" fill="' + INK + '"/>' +
        '<circle cx="' + (-4 + dx) + '" cy="-5" r="' + (hayron ? 3.5 : 5.4) + '" fill="#FFF"/>' +
        '<circle cx="' + (6 + dx) + '" cy="10" r="2.2" fill="#FFF"/>' +
        '<path d="M-21 -14 Q0 -30 22 -16 L22 -6 Q0 -16 -21 -4 Z" fill="url(#' + id.slice(0, -1) + 't)"/>' +
      '</g>' +
      (uyal ? '<path d="M-23 -10 Q-2 -28 22 -14 L22 -3 Q0 -10 -23 -1 Z" fill="#FFFFFF"/><path d="M-23 -1 Q0 -10 22 -3" fill="none" stroke="' + INK + '" stroke-width="' + lash + '" stroke-linecap="round"/>'
            : '<path d="M-23 -7 Q-2 -26 22 -12" fill="none" stroke="' + INK + '" stroke-width="' + lash + '" stroke-linecap="round"/>') +

    return g + '</g>';
  }
  function qosh(x, y, m, chap, p, holat){
    var t = "translate(" + x + " " + y + ") scale(" + (chap ? m : -m) + " " + m + ")";
    var d = holat === "hayron" ? "M-22 -50 Q-6 -58 12 -51" : holat === "qizargan" ? "M-22 -39 Q-6 -43 11 -50" : holat === "kulgan" ? "M-22 -43 Q-6 -50 12 -44" : "M-22 -41 Q-6 -47 12 -42";
    return '<path transform="' + t + '" d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="' + (p.ayol ? 2.6 : 4.2) + '" stroke-linecap="round"/>';
  }
  function ogiz(p, holat){
    if (holat === "kulgan") return '<path d="M135 254 Q150 278 165 254 Z" fill="' + INK + '" stroke="' + INK + '" stroke-width="2" stroke-linejoin="round"/><path d="M141 265 Q150 260 159 265 Q150 273 141 265 Z" fill="#9A9A9A"/>';

    if (holat === "qizargan") return '<path d="M140 263 Q145 259 150 263 Q155 267 160 263" fill="none" stroke="' + INK + '" stroke-width="2.2" stroke-linecap="round"/>';
    return '<path d="M140 260 Q150 ' + (p.ayol ? 267 : 265) + ' 160 260" fill="none" stroke="' + INK + '" stroke-width="2.2" stroke-linecap="round"/>';
  }
  function qizarish(holat){
    if (holat !== "qizargan" && holat !== "kulgan") return "";
    var s = '<path d="M104 242 l-5 9 M112 242 l-5 9 M120 242 l-5 9 M182 242 l-5 9 M190 242 l-5 9 M198 242 l-5 9" stroke="' + INK + '" stroke-width="1.8" stroke-linecap="round"/>';
    if (holat === "qizargan") s += '<path d="M100 252 l-4 7 M128 242 l-5 9 M174 242 l-5 9 M206 250 l-4 7" stroke="' + INK + '" stroke-width="1.6" stroke-linecap="round"/>';
    return s;
  }
  // kesim: "bust" — yelkagacha, "yuz" — yaqin kadr, "koz" — faqat ko'zlar
  var KESIM = {bust: "20 40 260 380", yuz: "70 84 160 230", koz: "60 160 180 72"};

  // Ramz: biroz jingalak (to'lqinli) soch va yumaloq ko'zoynak.
  function jingalak(rang, yorug){
    return '<path fill="' + rang + '" stroke="' + INK + '" stroke-width="2.5" stroke-linejoin="round" d="' +
        'M86 172 C74 120 92 74 128 64 C136 52 156 50 166 60 C200 64 228 106 216 172 ' +
        'Q212 152 202 158 Q198 138 184 152 Q178 132 164 148 Q156 128 144 146 Q132 130 124 150 Q112 136 106 158 Q96 146 92 166 Z"/>' +
      '<path d="M202 158 q4 8 -1 14 M164 148 q5 9 -1 15 M124 150 q-4 9 2 15 M92 166 q-5 6 -2 12" fill="none" stroke="' + INK + '" stroke-width="2.4" stroke-linecap="round"/>' +
      '<path d="M112 100 q10 -14 24 -12 M150 82 q12 -8 26 0 M182 104 q8 4 12 14 M118 124 q8 -8 18 -6 M160 112 q10 -6 18 2" fill="none" stroke="' + yorug + '" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>';
  }
  function kozoynak(rang){
    return '<g fill="rgba(255,255,255,.1)" stroke="' + rang + '" stroke-width="3.2" stroke-linejoin="round">' +
        '<circle cx="120" cy="208" r="28"/><circle cx="180" cy="208" r="28"/></g>' +
      '<path d="M148 204 Q150 198 152 204 M92 202 L86 197 M208 202 L214 197" fill="none" stroke="' + rang + '" stroke-width="3.2" stroke-linecap="round"/>' +
      '<path d="M104 222 L120 186 M114 226 L123 206 M164 222 L180 186" stroke="#FFF" stroke-width="2" opacity=".55" stroke-linecap="round"/>';
  }

  function personaj(kim, holat, kesim){
    var p = PERSONAJ[kim], id = "m" + (++sanoq);
    var chiz = ' stroke="' + INK + '" stroke-width="2.5" stroke-linejoin="round"';
    var soch = INK;
    var s = '<svg viewBox="' + (KESIM[kesim] || KESIM.bust) + '" xmlns="http://www.w3.org/2000/svg"><defs>' +
      '<radialGradient id="' + id + 'i" cx="50%" cy="72%" r="72%"><stop offset="0" stop-color="#B8B8B8"/><stop offset=".55" stop-color="#555"/><stop offset="1" stop-color="' + INK + '"/></radialGradient>' +
      '<pattern id="' + id + 't" width="4.5" height="4.5" patternUnits="userSpaceOnUse"><circle cx="2.25" cy="2.25" r=".95" fill="' + INK + '"/></pattern>' +
      '<pattern id="' + id + 'q" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#FFF"/><circle cx="2" cy="2" r="1.35" fill="' + INK + '"/></pattern>' +
      '</defs>';
    var tone = "url(#" + id + "t)", qalin = "url(#" + id + "q)";
    if (p.ayol){
      s += '<path fill="' + soch + '"' + chiz + ' d="M78 126 C56 210 54 330 44 420 L256 420 C246 330 244 210 222 126 C210 60 90 60 78 126 Z"/>' +
        '<path d="M70 200 C66 280 64 350 60 410 M232 200 C236 280 238 350 242 410" fill="none" stroke="#FFF" stroke-width="1.6" opacity=".55"/>' +
        '<path fill="#FFF"' + chiz + ' d="M46 420 C52 362 92 334 128 322 L172 322 C208 334 248 362 254 420 Z"/>' +
        '<path fill="' + qalin + '"' + chiz + ' d="M46 420 C52 362 92 334 128 322 L140 420 Z M254 420 C248 362 208 334 172 322 L160 420 Z"/>' +
        '<path fill="#FFFFFF"' + chiz + ' d="M128 322 L150 376 L172 322 Z"/>' +
        '<path fill="#FFFFFF"' + chiz + ' d="M128 320 L116 346 L146 354 Z M172 320 L184 346 L154 354 Z"/>' +
        '<path fill="' + INK + '" d="M150 358 L137 349 L137 367 Z M150 358 L163 349 L163 367 Z"/><circle cx="150" cy="358" r="4.5" fill="' + INK + '"/>';
    } else {
      s += '<path fill="' + qalin + '"' + chiz + ' d="M42 420 C48 360 92 330 128 320 L172 320 C208 330 252 360 258 420 Z"/>' +
        '<path fill="none" stroke="' + INK + '" stroke-width="2" d="M96 360 C110 380 112 400 110 420 M204 360 C190 380 188 400 190 420"/>';
    }
    s += '<path fill="#FFF"' + chiz + ' d="M133 258 L133 326 Q150 338 167 326 L167 258 Z"/>' +
      '<path fill="' + tone + '" d="M134 266 Q150 300 166 266 L166 292 Q150 308 134 292 Z"/>';
    if (!p.ayol){
      s += '<path fill="#FFF"' + chiz + ' d="M108 316 C116 348 184 348 192 316 C180 336 120 336 108 316 Z"/>' +

      koz(id + "a", 120, p.kozY, p.m, true, p, holat) +
      koz(id + "b", 180, p.kozY, p.m, false, p, holat) +
      '<path d="M151 236 L148 245" fill="none" stroke="' + INK + '" stroke-width="1.8" stroke-linecap="round" opacity=".6"/>' +
      ogiz(p, holat);
    if (p.ayol){

        '<path fill="' + soch + '"' + chiz + ' d="M220 140 C232 214 224 274 242 340 L218 306 C214 254 216 200 212 150 Z"/>' +
        '<path fill="' + soch + '"' + chiz + ' d="M80 170 C66 92 108 48 152 48 C198 48 236 92 220 172 L206 140 L198 176 L188 132 L176 166 L166 126 L156 162 L144 124 L134 164 L122 128 L112 170 L104 138 L96 178 Z"/>' +
        '<path d="M100 98 Q150 66 200 98 Q150 80 100 98 Z" fill="#FFF"/>' +
        '<path d="M118 70 L112 92 M150 60 L150 84 M182 70 L188 92" stroke="#FFF" stroke-width="1.8" stroke-linecap="round" opacity=".8"/>' +
        '<g transform="translate(206 116)" stroke="' + INK + '" stroke-width="1.6" fill="#FFF"><circle cx="0" cy="-7" r="5.5"/><circle cx="7" cy="-2" r="5.5"/><circle cx="4" cy="6" r="5.5"/><circle cx="-4" cy="6" r="5.5"/><circle cx="-7" cy="-2" r="5.5"/><circle r="2.6" fill="' + INK + '"/></g>';

  /* ── sahna buyumlari (SVG) ────────────────── */
  var SHAHAR = '<path d="M0 120 V86 H18 V70 H34 V92 H52 V62 H70 V80 H86 V54 H104 V76 H120 V90 H138 V66 H156 V58 H170 V84 H188 V72 H206 V94 H222 V60 H240 V78 H258 V88 H276 V70 H292 V120 Z"/><path d="M299 120 V46 L302 6 L305 46 V120 Z"/><ellipse cx="302" cy="46" rx="8" ry="5"/><ellipse cx="302" cy="62" rx="5" ry="3"/><path d="M312 120 V82 H330 V64 H348 V86 H366 V74 H384 V90 H400 V120 Z"/>';
  var BUYUM = {
    shahar: function(rang){ return '<svg class="shahar" viewBox="0 0 400 120" preserveAspectRatio="none" fill="' + (rang || INK) + '">' + SHAHAR + '</svg>'; },

  var kitob = document.getElementById("kitob");
  function el(teg, sinf, matn){ var e = document.createElement(teg); if (sinf) e.className = sinf; if (matn != null) e.textContent = matn; return e; }
  function ismQoy(m){ return m.replace(/Omina/g, ISM).replace(/Ramz/g, MUALLIF); }
  function joyla(e, x, y, w){ e.style.left = x + "%"; e.style.top = y + "%"; if (w != null) e.style.width = w + "%"; return e; }

  function kadrChiz(k){
    var d = el("div", "kadr"); d.style.gridArea = k.j;
    (k.fon || []).forEach(function(f){
      var c = el("div", f.split(" ").map(function(x, i){ return i ? x : "f-" + x; }).join(" "));
      if (f === "yulduz"){
        for (var n = 0; n < 40; n++){ var i = el("i"); i.style.left = Math.random() * 100 + "%"; i.style.top = Math.random() * 70 + "%"; c.appendChild(i); }
      }
      d.appendChild(c);
    });
    (k.b || []).forEach(function(b){
      var src = BUYUM[b[0]];
      var html = typeof src === "function" ? src(b[5]) : src;
      var w = el("div"); w.innerHTML = html;
      var svg = w.firstChild;
      if (b[0] === "shahar"){ d.appendChild(svg); return; }
      svg.style.position = "absolute"; svg.style.width = b[3] + "%"; svg.style.left = b[1] + "%"; svg.style.top = b[2] + "%";
      if (b[4]) svg.style.transform = "rotate(" + b[4] + "deg)";
      if (b[6]) svg.style.zIndex = b[6];      // personaj ustida turishi kerak bo'lsa
      d.appendChild(svg);
    });
    for (var n = 0; n < (k.barg || 0); n++){
      var bg = el("i", "barg");
      bg.style.left = Math.random() * 92 + "%"; bg.style.top = Math.random() * 85 + "%";
      bg.style.transform = "rotate(" + Math.round(Math.random() * 360) + "deg) scale(" + (.7 + Math.random() * .6).toFixed(2) + ")";
      d.appendChild(bg);
    }
    (k.pj || []).forEach(function(p){
      var c = el("div", "pj");
      c.style.top = p[4] + "%"; c.style.height = p[5] + "%";
      if (p[3] === "c"){ c.style.left = "50%"; c.style.transform = "translateX(-50%)"; } else c.style.left = p[3] + "%";
      c.innerHTML = personaj(p[0], p[1], p[2]);
      d.appendChild(c);
    });
    (k.yalt || []).forEach(function(y){
      var s = joyla(el("span", "yaltir" + ((k.fon || []).indexOf("qora") > -1 ? " oq" : ""), "✦"), y[0], y[1]);
      d.appendChild(s);
    });
    (k.h || []).forEach(function(h){
      var e = joyla(el("div", "hikoya" + (h[4] ? " " + h[4] : ""), ismQoy(h[0])), h[1], h[2], h[3]);
      if (h[5] === "past"){ e.style.top = "auto"; e.style.bottom = h[2] + "%"; }   // kadr pastiga yopishadi — kichik ekranda ham chiqib ketmaydi
      d.appendChild(e);
    });
    (k.g || []).forEach(function(g){ d.appendChild(joyla(el("div", "pufak " + (g[4] || "d-past"), ismQoy(g[0])), g[1], g[2], g[3])); });
    (k.sfx || []).forEach(function(s){

      if (s[4]) e.style.transform = "rotate(" + s[4] + "deg)";
      d.appendChild(e);
    });

  function muqova(){

    var nom = el("div", "muqova-nom");
    nom.appendChild(el("h1", "", ISM.toUpperCase()));
    nom.appendChild(el("p", "", "1-bob · Ikki shahar orasida"));
    d.appendChild(nom);
    d.appendChild(el("div", "muqova-raqam", "01"));
    d.appendChild(el("div", "muqova-muallif", "muallif: " + MUALLIF));

  function oxir(){
    var b = el("section", "bet"); b.style.gridTemplate = "1fr / 1fr";

    t.appendChild(a1); t.appendChild(a2); i.appendChild(t);

    b.appendChild(d);
    return b;
  }

  SAHIFALAR.forEach(function(s, n){
    var bet;
    if (s.muqova) bet = muqova();
    else if (s.oxir) bet = oxir();
    else {
      bet = el("section", "bet");
      bet.style.gridTemplateRows = s.qator;
      bet.style.gridTemplateColumns = s.ustun;
      bet.style.gridTemplateAreas = s.joy;

    bet.setAttribute("aria-label", s.muqova ? "Muqova" : s.oxir ? "Oxiri" : n + "-sahifa");
    kitob.appendChild(bet);
