<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ikki deraza</title>
<meta name="description" content="Omina uchun kichkina multfilm: ikki shahar, ikki deraza, bitta Oy.">
<meta name="theme-color" content="#0E1024">
<meta property="og:title" content="Ikki deraza 🪟🌙🪟 — sen uchun multfilm">
<meta property="og:description" content="Toshkent. Andijon. Oralarida 300 km. Oxirida esa — sen hal qilasan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,500&family=Caveat:wght@600;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
  :root{
    --tun:#0E1024; --matn:#F2EADB; --oltin:#FFD98A; --pushti:#F7B4C6;
    --lora:"Lora",Georgia,serif; --qol:"Caveat",cursive; --dum:"M PLUS Rounded 1c",system-ui,sans-serif;
    --chok:72px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#07081A;overflow:hidden}
  body{color:var(--matn);font-family:var(--lora);-webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  [hidden]{display:none!important}

  #sahna{position:fixed;inset:0;margin:0 auto;max-width:520px;display:flex;flex-direction:column;overflow:hidden;
    background:var(--tun);touch-action:none}

  /* ---------- yarimlar ---------- */
  .yarim{position:relative;flex:1 1 0;overflow:hidden;opacity:0;transition:opacity 2s}
  .yarim.kor{opacity:1}
  #T{background:linear-gradient(180deg,#1B1A4A 0%,#2B2160 60%,#3A2667 100%)}
  #A{background:linear-gradient(0deg,#141A44 0%,#1E2A5C 60%,#2A3268 100%)}
  .yulduzlar{position:absolute;inset:0}
  .yulduzlar i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:milt 3s ease-in-out infinite}
  @keyframes milt{0%,100%{opacity:.2}50%{opacity:.9}}
  .oy{position:absolute;top:10%;width:46px;height:46px;border-radius:50%;
    background:radial-gradient(circle at 38% 36%,#FFFBEA,#F6E7B8 65%,#E2CB8A);
    box-shadow:0 0 30px 8px #F6E7B844,0 0 80px 20px #F6E7B822;opacity:0;transition:opacity 2.4s,transform 2.4s;transform:translateY(14px)}
  .oy.kor{opacity:1;transform:none}
  #T .oy{right:12%} #A .oy{left:12%}
  .silueti{position:absolute;bottom:0;width:44%;height:auto}
  #T .silueti{right:0} #A .silueti{left:0}
  .shahar{position:absolute;bottom:10px;font:800 .62rem var(--dum);letter-spacing:.22em;color:#ffffffa0;text-transform:uppercase}
  #T .shahar{right:12px} #A .shahar{left:12px}

  .devor{position:absolute;top:0;bottom:0;width:58%;background-color:#28213F;
    background-image:repeating-linear-gradient(0deg,#ffffff07 0 1px,transparent 1px 15px),repeating-linear-gradient(90deg,#00000018 0 1px,transparent 1px 30px);
    box-shadow:0 0 30px #0007;transition:transform .25s linear}
  #T .devor{left:0;border-right:2px solid #0004}
  #A .devor{right:0;border-left:2px solid #0004;background-color:#231F3A}

  /* ---------- deraza ---------- */
  .devor{container-type:size}
  .deraza{position:absolute;left:50%;top:50%;width:min(78cqw,56cqh);aspect-ratio:4/5;translate:-50% -50%;transition:box-shadow 1.2s}
  .deraza::after{content:"";position:absolute;left:-9%;right:-9%;bottom:-8%;height:7%;background:#D8CAAE;border-radius:3px;box-shadow:0 4px 8px #0006}
  .oyna{position:absolute;inset:0;overflow:hidden;border-radius:4px;background:#0B0B1C}
  .xona{position:absolute;inset:0;opacity:0;transition:opacity 1.2s;
    background:radial-gradient(120% 90% at 50% 25%,#FFE5B4 0%,#EFB277 45%,#9B6440 100%)}
  #A .xona{background:radial-gradient(120% 90% at 50% 25%,#FFE9C4 0%,#E8B07C 45%,#7E5A44 100%)}
  .deraza.yoniq{box-shadow:0 0 50px 8px #FFC97A33}
  .deraza.yoniq .xona{opacity:1}
  .parda{position:absolute;top:0;width:24%;height:74%;opacity:0;transition:opacity 1.2s}
  .deraza.yoniq .parda{opacity:1}
  .parda.chap{left:0;clip-path:polygon(0 0,100% 0,38% 100%,0 100%)}
  .parda.ong{right:0;clip-path:polygon(0 0,100% 0,100% 100%,62% 100%)}
  #T .parda{background:linear-gradient(90deg,#C4566C,#EE97A8,#C4566C)}
  #A .parda{background:linear-gradient(90deg,#4F6286,#8297BE,#4F6286)}
  .odam{position:absolute;left:4%;width:92%;bottom:-7%;opacity:0;transition:opacity 1.2s .3s}
  .odam svg{display:block;width:100%;height:auto}
  .deraza.yoniq .odam{opacity:1}
  .ekranNur{position:absolute;inset:0;opacity:0;transition:opacity .8s;pointer-events:none;
    background:radial-gradient(45% 30% at 50% 60%,#CFE3FF66,transparent);mix-blend-mode:screen}
  .deraza.telefonda .ekranNur{opacity:1}
  .buyum{position:absolute;left:50%;bottom:-9%;width:21%;translate:-50% 130%;transition:translate .9s cubic-bezier(.3,1.3,.5,1)}
  .buyum.kor{translate:-50% 0}
  .buyum svg{display:block;width:100%;height:auto}
  .tuman{position:absolute;inset:0;background:rgba(226,236,250,0);transition:background 2.5s,backdrop-filter 2.5s}
  .tuman.kor{background:rgba(226,236,250,.3);backdrop-filter:blur(1.4px);-webkit-backdrop-filter:blur(1.4px)}
  .chizma{position:absolute;top:5%;width:36%;overflow:visible}
  #T .chizma{left:5%} #A .chizma{right:5%}
  .chizma path{fill:none;stroke:#FFF4DA;stroke-width:5;stroke-linecap:round;opacity:.9;
    stroke-dasharray:110;stroke-dashoffset:110;filter:drop-shadow(0 0 3px #fff8)}
  .chizma path.chiz{transition:stroke-dashoffset 2.2s ease-in-out;stroke-dashoffset:0}
  .yaltir{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(125deg,transparent 30%,#ffffff14 38%,transparent 46%,transparent 60%,#ffffff0d 64%,transparent 70%)}
  .rom{position:absolute;inset:-7px;border:7px solid #E9DEC6;border-radius:8px;pointer-events:none;
    box-shadow:inset 0 0 0 2px #0003,0 3px 10px #0006}

  .gap{position:absolute;top:30%;max-width:44%;padding:9px 12px;border-radius:16px;background:#FFFFFF;color:#2A2140;
    font:800 .86rem/1.3 var(--dum);box-shadow:0 6px 18px #0005;opacity:0;transform:scale(.6);transition:opacity .35s,transform .45s cubic-bezier(.3,1.6,.5,1);z-index:3}
  .gap.kor{opacity:1;transform:scale(1)}
  .gap::after{content:"";position:absolute;bottom:-7px;width:14px;height:14px;background:#fff;rotate:45deg;border-radius:2px}
  #T .gap{right:5%;transform-origin:left bottom} #T .gap::after{left:16px}
  #A .gap{left:5%;transform-origin:right bottom} #A .gap::after{right:16px}

  /* ---------- oradagi masofa ---------- */
  #chok{position:relative;flex:none;height:var(--chok);overflow:hidden;z-index:2;
    background:linear-gradient(180deg,#05061299,#0A0B1F 30%,#0A0B1F 70%,#05061299)}
  #toglar{position:absolute;inset:0;opacity:.85;background-repeat:repeat-x;background-size:240px 100%;background-position:0 100%}
  #yol{position:absolute;left:0;right:0;top:50%;height:0;border-top:2px dashed #FFD98A55}
  #kmKichik{position:absolute;right:10px;top:6px;font:800 .62rem var(--dum);letter-spacing:.12em;color:#FFD98Aaa;opacity:0;transition:opacity 1s}
  #kmKichik.kor{opacity:1}

  #izoh{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:6;width:max-content;max-width:90%;
    padding:10px 18px;border-radius:16px;background:#0B0C22E8;box-shadow:0 0 0 1px #ffffff1c,0 10px 30px #0008;
    font:italic 500 1.02rem/1.4 var(--lora);text-align:center;color:var(--matn);opacity:0;transition:opacity .6s}
  #izoh.kor{opacity:1}

  /* ---------- kulminatsiya ---------- */
  #halqa{position:absolute;left:50%;top:50%;translate:-50% -50%;width:118px;height:118px;border-radius:50%;z-index:7;
    display:grid;place-items:center;text-align:center;opacity:0;transition:opacity .8s;pointer-events:none}
  #halqa.kor{opacity:1}
  #halqa svg{position:absolute;inset:0;width:100%;height:100%;rotate:-90deg}
  #halqa .fon{fill:#0B0C22E6;stroke:#ffffff22;stroke-width:3}
  #halqa .tola{fill:none;stroke:url(#halqaRang);stroke-width:6;stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3}
  #halqa b{position:relative;font:800 1.55rem/1 var(--dum);color:#fff}
  #halqa small{position:relative;display:block;font:800 .6rem var(--dum);letter-spacing:.2em;color:#FFD98A;margin-top:3px}
  #halqa::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid #F7B4C6;animation:zarb 1.6s ease-out infinite}
  #halqa.bosilgan::before{animation-duration:.7s}
  @keyframes zarb{from{transform:scale(.85);opacity:.9}to{transform:scale(1.35);opacity:0}}
  #yoriqnoma{position:absolute;left:50%;top:calc(50% + 78px);translate:-50% 0;z-index:7;width:88%;text-align:center;
    font:700 1.5rem/1.15 var(--qol);color:#fff;text-shadow:0 2px 12px #000;opacity:0;transition:opacity .5s;pointer-events:none}
  #yoriqnoma.kor{opacity:1}

  #effekt{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
  .uchar{position:absolute;left:0;top:0;font-size:26px;line-height:1;filter:drop-shadow(0 0 8px #ff8fb0)}
  .soz{position:absolute;left:0;top:0;font:700 1.45rem var(--qol);color:#FFF4DA;white-space:nowrap;text-shadow:0 0 10px #FFD98A}
  #qor{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
  #chaqnash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
  #chaqnash.yon{animation:chaq 1.6s ease-out}
  @keyframes chaq{0%{opacity:0}12%{opacity:1}100%{opacity:0}}

  /* ---------- final ---------- */
  #final{position:absolute;inset:0;z-index:4;opacity:0;transition:opacity 1.4s;
    background:linear-gradient(180deg,#1A1A4A 0%,#2C2363 45%,#3D2A6B 100%)}
  #final.kor{opacity:1}
  #final .oy{right:10%;top:5%;width:52px;height:52px}
  #final .devor{left:0;right:0;width:auto;top:auto;height:62%;bottom:0;border:0}
  #final .silueti{width:100%;bottom:62%}
  #final .deraza{top:auto;bottom:40%;translate:-50% 0;height:auto;width:min(84cqw,58cqh);aspect-ratio:6/5;max-width:none}
  #final .odam{width:60%;bottom:-12%;transition:opacity 1.2s .2s}
  #final .odam.o{left:-3%;rotate:4deg;z-index:2}
  #final .odam.r{right:-3%;left:auto;rotate:-5deg;z-index:1}
  #final .chizma{left:39%;right:auto;top:3%;width:22%}
  #final .chizma path{stroke-dashoffset:0}
  #final .chizma .butun{fill:#FF8FB0;stroke:none;opacity:0;transition:opacity 1.5s;filter:drop-shadow(0 0 10px #ff8fb0)}
  #final .chizma.birlashdi .butun{opacity:.9}
  #final .chizma .yarmi{transition:transform 1.6s cubic-bezier(.4,0,.2,1)}
  #final .chizma .yarmi.chap{transform:translateX(-30px)}
  #final .chizma .yarmi.ong{transform:translateX(30px)}
  #final .chizma.birlashdi .yarmi{transform:none}
  #yakunMatn{position:absolute;left:0;right:0;bottom:calc(4% + env(safe-area-inset-bottom));padding:0 18px;text-align:center;z-index:6}
  #yakunMatn p{font:700 1.65rem/1.2 var(--qol);color:#FFF4DA;text-shadow:0 2px 14px #000c;opacity:0;transition:opacity 1s;min-height:2.4em;display:flex;align-items:center;justify-content:center}
  #yakunMatn p.kor{opacity:1}
  #qayta{margin-top:6px;padding:12px 24px;border-radius:999px;background:#ffffff1c;box-shadow:inset 0 0 0 1px #ffffff40;font:800 .9rem var(--dum);opacity:0;transition:opacity 1s}
  #qayta.kor{opacity:1}
  .uchuvchiYurak{position:absolute;bottom:30%;font-size:20px;animation:kotaril 4.5s ease-out forwards}
  @keyframes kotaril{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),-55vh) scale(1.2)}}

  /* ---------- boshlash ---------- */
  #boshlash{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:24px;background:radial-gradient(90% 60% at 50% 35%,#2B2160,#0E1024 75%);transition:opacity 1s}
  #boshlash.ket{opacity:0;pointer-events:none}
  .ikkiDeraza{display:flex;gap:18px;margin-bottom:26px}
  .ikkiDeraza i{width:54px;height:66px;border-radius:5px;border:5px solid #E9DEC6;background:radial-gradient(circle at 50% 30%,#FFE5B4,#E5A56A);
    box-shadow:0 0 30px #FFC97A55;animation:yon 3s ease-in-out infinite}
  .ikkiDeraza i:last-child{animation-delay:1.5s}
  @keyframes yon{0%,100%{filter:brightness(.8)}50%{filter:brightness(1.1)}}
  #boshlash h1{font:600 2.3rem var(--lora);color:#FFF4DA}
  #boshlash .ost{font:700 1.4rem var(--qol);color:var(--pushti);margin-top:4px}
  #boshlash .izoh2{font:500 .85rem/1.5 var(--dum);color:#B9B3D6;margin-top:24px}
  #play{margin-top:26px;width:84px;height:84px;border-radius:50%;background:linear-gradient(180deg,#FFE7A8,#F1C46A);
    color:#2A1E3F;font-size:2rem;display:grid;place-items:center;box-shadow:0 0 0 10px #F1C46A22,0 10px 30px #F1C46A55;padding-left:6px}
  #play:active{transform:scale(.95)}
  #ovoz{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:25;width:38px;height:38px;border-radius:50%;
    background:#0006;display:grid;place-items:center;font-size:1rem}

  @media (prefers-reduced-motion:reduce){
    .yulduzlar i,#halqa::before,.ikkiDeraza i{animation:none}
  }
</style>
</head>
<body>
<div id="sahna">
  <section class="yarim" id="T">
    <div class="yulduzlar"></div>
    <div class="oy"></div>
    <svg class="silueti" viewBox="0 0 160 120" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <!-- Toshkent: teleminora va baland uylar -->
      <g fill="#120F2C">
        <rect x="104" y="18" width="3" height="102"/><path d="M98 120 L105.5 70 L113 120 Z"/>
        <ellipse cx="105.5" cy="46" rx="7" ry="3.2"/><ellipse cx="105.5" cy="58" rx="5" ry="2.2"/><rect x="105" y="4" width="1" height="16"/>
        <rect x="8" y="70" width="22" height="50"/><rect x="34" y="56" width="18" height="64"/><rect x="56" y="80" width="26" height="40"/>
        <rect x="118" y="74" width="16" height="46"/><rect x="138" y="88" width="22" height="32"/>
      </g>
      <g fill="#FFD98A" opacity=".7">
        <rect x="12" y="76" width="3" height="3"/><rect x="22" y="84" width="3" height="3"/><rect x="38" y="62" width="3" height="3"/><rect x="45" y="78" width="3" height="3"/>
        <rect x="62" y="86" width="3" height="3"/><rect x="72" y="96" width="3" height="3"/><rect x="122" y="82" width="3" height="3"/><rect x="144" y="94" width="3" height="3"/>
        <circle cx="105.5" cy="4" r="1.4" fill="#FF6B6B"/>
      </g>
    </svg>
    <div class="shahar">Toshkent</div>
    <div class="devor">
      <div class="deraza" id="dT">
        <div class="oyna">
          <div class="xona"></div>
          <div class="parda chap"></div><div class="parda ong"></div>
          <div class="odam"></div>
          <div class="ekranNur"></div>
          <div class="buyum"></div>
          <div class="tuman"></div>
          <svg class="chizma" viewBox="0 0 100 100"><path d="M50 84 C30 68 14 54 16 37 C18 22 37 18 50 33"/></svg>
          <div class="yaltir"></div>
        </div>
        <div class="rom"></div>
      </div>
    </div>
    <div class="gap"></div>
  </section>

  <div id="chok">
    <div id="toglar"></div>
    <div id="yol"></div>
    <div id="kmKichik">300 KM</div>
  </div>

  <section class="yarim" id="A">
    <div class="yulduzlar"></div>
    <div class="oy"></div>
    <svg class="silueti" viewBox="0 0 160 120" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <!-- Andijon: tog'lar, past uylar, gumbaz va minora -->
      <path fill="#1A1C46" d="M0 120 L0 74 L24 52 L44 70 L70 40 L98 68 L120 50 L160 82 L160 120 Z"/>
      <path fill="#E8EEF8" opacity=".5" d="M64 46 L70 40 L76 46 L72 45 L70 47 Z M20 56 L24 52 L28 56 L24 55 Z M116 54 L120 50 L124 54 L120 53 Z"/>
      <g fill="#120F2C">
        <rect x="6" y="96" width="24" height="24"/><rect x="34" y="102" width="20" height="18"/>
        <path d="M66 120 L66 96 Q80 78 94 96 L94 120 Z"/><rect x="99" y="72" width="7" height="48"/><path d="M98 72 L102.5 62 L107 72 Z"/>
        <rect x="112" y="100" width="22" height="20"/><rect x="138" y="94" width="22" height="26"/>
      </g>
      <g fill="#FFD98A" opacity=".7">
        <rect x="11" y="102" width="3" height="3"/><rect x="40" y="108" width="3" height="3"/><rect x="118" y="106" width="3" height="3"/><rect x="146" y="100" width="3" height="3"/>
        <circle cx="80" cy="104" r="1.6"/>
      </g>
    </svg>
    <div class="shahar">Andijon</div>
    <div class="devor">
      <div class="deraza" id="dA">
        <div class="oyna">
          <div class="xona"></div>
          <div class="parda chap"></div><div class="parda ong"></div>
          <div class="odam"></div>
          <div class="ekranNur"></div>
          <div class="buyum"></div>
          <div class="tuman"></div>
          <svg class="chizma" viewBox="0 0 100 100"><path d="M50 84 C70 68 86 54 84 37 C82 22 63 18 50 33"/></svg>
          <div class="yaltir"></div>
        </div>
        <div class="rom"></div>
      </div>
    </div>
    <div class="gap"></div>
  </section>

  <section id="final" hidden>
    <div class="yulduzlar"></div>
    <div class="oy kor"></div>
    <svg class="silueti" viewBox="0 0 320 60" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path fill="#1C1B48" d="M0 60 L0 30 L40 14 L80 34 L130 8 L170 30 L210 16 L260 36 L320 20 L320 60 Z"/>
    </svg>
    <div class="devor">
      <div class="deraza yoniq" id="dF">
        <div class="oyna">
          <div class="xona"></div>
          <div class="parda chap"></div><div class="parda ong"></div>
          <div class="odam o"></div>
          <div class="odam r"></div>
          <svg class="chizma" viewBox="0 0 100 100">
            <path class="butun" d="M50 84 C30 68 14 54 16 37 C18 22 37 18 50 33 C63 18 82 22 84 37 C86 54 70 68 50 84 Z"/>
            <path class="yarmi chap" d="M50 84 C30 68 14 54 16 37 C18 22 37 18 50 33"/>
            <path class="yarmi ong" d="M50 84 C70 68 86 54 84 37 C82 22 63 18 50 33"/>
          </svg>
          <div class="yaltir"></div>
        </div>
        <div class="rom"></div>
      </div>
    </div>
    <div id="yakunMatn"><p id="yakunQator"></p><button id="qayta">↺ Yana bir bor ko'rish</button></div>
  </section>

  <canvas id="qor"></canvas>
  <div id="effekt"></div>
  <div id="izoh"></div>
  <div id="halqa">
    <svg viewBox="0 0 120 120"><defs><linearGradient id="halqaRang" x1="0" x2="1"><stop offset="0" stop-color="#FFD98A"/><stop offset="1" stop-color="#FF8FB0"/></linearGradient></defs>
      <circle class="fon" cx="60" cy="60" r="54"/><circle class="tola" id="tola" cx="60" cy="60" r="54"/></svg>
    <div><b id="kmSon">300</b><small>KM</small></div>
  </div>
  <div id="yoriqnoma"></div>
  <div id="chaqnash"></div>
  <button id="ovoz" aria-label="Musiqani o'chirish" hidden>🎵</button>

  <section id="boshlash">
    <div class="ikkiDeraza"><i></i><i></i></div>
    <h1>Ikki deraza</h1>
    <p class="ost">Omina uchun kichkina multfilm</p>
    <button id="play" aria-label="Multfilmni boshlash">▶</button>
    <p class="izoh2">🎧 Ovozni och · 2 daqiqa<br>Oxirida sendan bitta ish so'rayman 🤫</p>
  </section>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const kamHarakat = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= Personajlar (anime bilan bir xil chizgi) ================= */
  var INK = "#1E1A1C";
  var PERSONAJ = {
    o: {ayol: true, teri: "#FCE5D6", soya: "#F1C9B5", soch: "#16151B", sochYorug: "#55525E", iris: ["#4A2418", "#DB9A60"], kozY: 210, kozMasshtab: 1.15},
    r: {ayol: false, teri: "#F8DCC8", soya: "#EBC3AC", soch: "#1C1C26", sochYorug: "#454560", iris: ["#120F0F", "#4E3E38"], kozY: 208, kozMasshtab: 1.06}
  };
  // Ellik yildan keyin: oq soch va ajinlar

/* ================= Film soati (sahifa yashirilsa to'xtaydi) ================= */
let soat = 0, oxirgi = null;
const kutuvchilar = [], kadrIshlari = new Set();
function kadr(t){
  const dt = oxirgi === null ? 0 : Math.min(100, t - oxirgi);
  oxirgi = t; soat += dt;
  for(let i = kutuvchilar.length - 1; i >= 0; i--) if(kutuvchilar[i].t <= soat){ kutuvchilar[i].hal(); kutuvchilar.splice(i,1); }
  kadrIshlari.forEach(f=>f(dt));
  requestAnimationFrame(kadr);
}
requestAnimationFrame(kadr);
document.addEventListener("visibilitychange", ()=>{ oxirgi = null; musiqa.pauza(document.hidden); });
const kut = ms => new Promise(hal=>kutuvchilar.push({ t:soat + ms, hal }));

function uch(el, dan, ga, ms, egri){
  const o = { x:(dan.x + ga.x)/2 + egri, y:(dan.y + ga.y)/2 };
  return new Promise(hal=>{
    const a = el.animate([
      { transform:`translate(${dan.x}px,${dan.y}px) translate(-50%,-50%) scale(.4)`, opacity:0 },
      { transform:`translate(${o.x}px,${o.y}px) translate(-50%,-50%) scale(1.3)`, opacity:1, offset:.5 },
      { transform:`translate(${ga.x}px,${ga.y}px) translate(-50%,-50%) scale(.8)`, opacity:0 }

kadrIshlari.add(dt=>{
  const w = qorKanva.clientWidth, h = qorKanva.clientHeight;
  qx.clearRect(0,0,w,h);
  if(qorYoq && qorlar.length < 90 && Math.random() < .5) qorlar.push({ x:Math.random()*w, y:-6, r:1 + Math.random()*2.4, v:18 + Math.random()*30, f:Math.random()*6 });
  qx.fillStyle = "#ffffffcc";

    q.y += q.v*dt/1000; q.f += dt/900; const x = q.x + Math.sin(q.f)*10;

const musiqa = (()=>{
  let ac = null, bosh = null, filtr = null, qadam = 0, keyingiVaqt = 0, taymer = null, daraja = 0, final = false, ochiq = true;
  const AKKORD = { F:{n:[53,57,60,65],b:41}, G:{n:[55,59,62,67],b:43}, Em:{n:[52,55,59,64],b:40}, Am:{n:[57,60,64,69],b:45}, C:{n:[55,60,64,67],b:36} };

  const KUY = { 0:[72,74,null,72], 1:[71,null,67,null], 2:[67,71,74,72], 3:[69,null,null,null] };

    const kech = ac.createDelay(); kech.delayTime.value = ZARB*1.5; const qayt = ac.createGain(); qayt.gain.value = .22;

      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v*kuch, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + uzun);
      o.connect(g); g.connect(filtr); o.start(t); o.stop(t + uzun + .05);
    });
  }
  function rejala(){
    while(keyingiVaqt < ac.currentTime + .25){
      const takt = Math.floor(qadam/8) % 4, ichida = qadam % 8;
      const ak = AKKORD[(final ? FINAL : QATOR)[takt]];
      const naqsh = [0,1,2,3,2,1,2,1][ichida];
      nota(ak.n[naqsh], keyingiVaqt, .32, 1.4);
      if(daraja >= 2 && ichida % 2 === 1) nota(ak.n[naqsh] + 12, keyingiVaqt, .14, .9, "sine");
      if(ichida === 0 || ichida === 4) nota(ak.b, keyingiVaqt, .5, 2.6, "sine");
      const kuy = (final ? KUY_F : KUY)[takt];
      if(daraja >= 1 && ichida % 2 === 0 && kuy[ichida/2]) nota(kuy[ichida/2], keyingiVaqt, .42, 1.8, "sine");
      keyingiVaqt += ZARB; qadam++;
    }
  }
  return {
    boshla(){
      if(!tayyor()) return; ac.resume(); keyingiVaqt = ac.currentTime + .1;
      if(!taymer) taymer = setInterval(rejala, 60);
      this.ovoz(ochiq);
    },
    ovoz(yoq){
      ochiq = yoq; if(!ac) return; const t = ac.currentTime;
      bosh.gain.cancelScheduledValues(t); bosh.gain.setValueAtTime(bosh.gain.value, t);
      bosh.gain.linearRampToValueAtTime(yoq ? (daraja >= 2 ? .2 : .15) : 0, t + 1);
    },
    daraja(n){ daraja = n; if(ochiq) this.ovoz(true); },
    final(){ final = true; qadam = 0; daraja = 2; if(ochiq) this.ovoz(true); },
    qayta(){ final = false; daraja = 0; qadam = 0; },
    pauza(yashirin){ if(!ac) return; yashirin ? ac.suspend() : ac.resume(); },
    get ochiq(){ return ochiq; }
  };
})();
$("ovoz").addEventListener("click", e=>{
  e.stopPropagation(); musiqa.ovoz(!musiqa.ochiq);
  $("ovoz").textContent = musiqa.ochiq ? "🎵" : "🔇";
  $("ovoz").setAttribute("aria-label", musiqa.ochiq ? "Musiqani o'chirish" : "Musiqani yoqish");
});
$("ovoz").addEventListener("pointerdown", e=>e.stopPropagation());

function titra(n){ try{ navigator.vibrate && navigator.vibrate(n); }catch(e){} }

/* ================= Kulminatsiya: masofani bosib qisqartirish ================= */
const BOSQICH = [
  { km:300, matn:"Bosib tur… 🤍" },
  { km:240, matn:"Ohangarondan o'tdik…" },
  { km:180, matn:"Qamchiq dovoni ⛰️ qo'yib yuborma!" },
  { km:110, matn:"Farg'ona vodiysi… yuragim tez uryapti" },
  { km:45,  matn:"Andijon chiroqlari ko'rinyapti…" },
  { km:10,  matn:"Yana ozgina, jonim…" }
];
function masofaniQisqartir(){
  return new Promise(hal=>{
    const sahna = $("sahna");
    let p = 0, bosilgan = false, oxirgiKm = 300, siljish = 0, tugadi = false;
    const chokBosh = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--chok")) || 72;
    $("halqa").classList.add("kor"); $("kmKichik").classList.remove("kor");
    $("yoriqnoma").textContent = BOSQICH[0].matn; $("yoriqnoma").classList.add("kor");
    const bos = e=>{ if(tugadi) return; e.preventDefault(); bosilgan = true; $("halqa").classList.add("bosilgan"); titra(20); };
    const qoy = ()=>{
      if(tugadi || !bosilgan) return; bosilgan = false; $("halqa").classList.remove("bosilgan");
      if(p > .03) $("yoriqnoma").textContent = "Qo'yib yuborma… 🥺 masofa qaytib uzayapti";
    };
    sahna.addEventListener("pointerdown", bos);
    ["pointerup","pointercancel","pointerleave"].forEach(t=>sahna.addEventListener(t, qoy));
    const ish = dt=>{
      p = bosilgan ? Math.min(1, p + dt/6500) : Math.max(0, p - dt/16000);
      const km = Math.round(300*(1 - p));
      $("kmSon").textContent = km;
      $("tola").style.strokeDashoffset = (339.3*(1 - p)).toFixed(1);
      document.documentElement.style.setProperty("--chok", (chokBosh*(1 - p)).toFixed(1) + "px");
      T.devor.style.transform = `translateY(${(p*16).toFixed(2)}%)`;
      A.devor.style.transform = `translateY(${(-p*16).toFixed(2)}%)`;
      if(bosilgan){ siljish -= dt*.12; $("toglar").style.backgroundPositionX = siljish + "px"; }
      if(bosilgan){
        const b = [...BOSQICH].reverse().find(x=>km <= x.km);
        if(b && $("yoriqnoma").textContent !== b.matn) $("yoriqnoma").textContent = b.matn;
        if(Math.floor(km/25) !== Math.floor(oxirgiKm/25)) titra(12);
      }
      oxirgiKm = km;
      if(p >= 1 && !tugadi){
        tugadi = true; kadrIshlari.delete(ish);
        sahna.removeEventListener("pointerdown", bos);
        ["pointerup","pointercancel","pointerleave"].forEach(t=>sahna.removeEventListener(t, qoy));
        $("halqa").classList.remove("kor","bosilgan"); $("yoriqnoma").classList.remove("kor");
        titra([40,60,40,60,120]);
        hal();
      }
    };
    kadrIshlari.add(ish);
  });
}
$("sahna").addEventListener("contextmenu", e=>e.preventDefault());

/* ================= Final ================= */
async function final(){
  $("chaqnash").classList.remove("yon"); void $("chaqnash").offsetWidth; $("chaqnash").classList.add("yon");
  musiqa.final();
  await kut(250);
  const f = $("final");
  f.querySelector(".odam.o").innerHTML = sprite("o", "kulgan");
  f.querySelector(".odam.r").innerHTML = sprite("r", "qizargan");
  f.querySelector(".chizma").classList.remove("birlashdi");
  f.hidden = false; requestAnimationFrame(()=>f.classList.add("kor"));
  await kut(1800);
  const q = $("yakunQator");
  const qator = async (m, ms)=>{ q.textContent = m; q.classList.add("kor"); await kut(ms); q.classList.remove("kor"); await kut(900); };
  await qator("0 km.", 2400);
  await qator("Esingdami, har birimiz yurakning faqat yarmini chizgandik?", 3800);
  f.querySelector(".chizma").classList.add("birlashdi");
  yuraklarYogdir(f);
  await qator("Chunki ikkinchi yarmi doim senda edi.", 3800);
  f.querySelector(".odam.r").innerHTML = sprite("r", "kulgan");
  await qator("Bu hozircha multfilm…", 2800);
  await qator("Lekin men har kuni shu kunni yaqinlashtiryapman.", 3800);
  await qator("Bitta deraza. Bitta Oy. Bitta choynak ☕", 3800);
  q.textContent = "Seni sevaman, Omina. — Ramz"; q.classList.add("kor");
  await kut(1600);
  $("qayta").classList.add("kor");
}
function yuraklarYogdir(f){
  for(let i=0;i<22;i++){
    setTimeout(()=>{
      const y = document.createElement("div"); y.className = "uchuvchiYurak";
      y.textContent = ["💗","💖","🤍","💕"][i%4];
      y.style.left = (10 + Math.random()*80) + "%";
      y.style.setProperty("--x", ((Math.random() - .5)*80).toFixed(0) + "px");
      f.appendChild(y); setTimeout(()=>y.remove(), 4600);
    }, i*260);
  }
}

  A.chizma.classList.add("chiz"); ifoda(A, "kulgan");
  await kut(2300);
  await izoh("Ikkalasi ham yurakning faqat yarmini chizdi.", 3400);
  await izoh("Nega? Buni oxirida bilasan 😉", 2800);

  qorYoq = true; ifoda(T, "hayron"); ifoda(A, "hayron");
  await izoh("Keyin birinchi qor yog'di. Ikki shaharga — bir vaqtda.", 3600);
  ifoda(T, "kulgan"); ifoda(A, "kulgan");
  gap(T, "Qor yog'yapti!! ❄️", 2600);
  await kut(500);
  await gap(A, "Bizda ham!! ❄️", 2400);
  buyum(T, "piyola"); buyum(A, "piyola");
  await izoh("Ikkalasi bir xil choy damladi. Bir xil sog'indi.", 3400);

  buyum(T, null); buyum(A, null); ifoda(T, "oddiy"); ifoda(A, "oddiy");
  await kut(600);
  await sozUchir("Yaxshi uxla, jonim", A, T);
  ifoda(T, "qizargan");
  await izoh("Ba'zan so'z 300 km ni bir soniyada bosib o'tadi.", 3400);
  await izoh("Lekin quchoq bosib o'tolmaydi.", 3000);

  musiqa.daraja(2);
  await izoh("Omina, endi navbat senda.", 2800);
  await izoh("Barmog'ingni ekranga bosib tur — masofani birga qisqartiramiz.", 3600);
  await masofaniQisqartir();
  await final();
}

/* ================= Boshlash / qayta ================= */
function tiklash(){
  [T, A].forEach(s=>{
    chiroq(s, false); buyum(s, null); s.tuman.classList.remove("kor"); s.chizma.classList.remove("chiz");
    s.oy.classList.remove("kor"); s.r.classList.remove("kor"); s.devor.style.transform = ""; s.gap.classList.remove("kor");
  });
  $("kmKichik").classList.remove("kor");
  document.documentElement.style.removeProperty("--chok");
  $("final").classList.remove("kor"); $("final").hidden = true;
  $("yakunQator").classList.remove("kor"); $("qayta").classList.remove("kor");
  $("tola").style.strokeDashoffset = 339.3; $("kmSon").textContent = 300;
  qorYoq = false; qorlar = [];
}
let ketyapti = false;
async function ishga(){
  if(ketyapti) return; ketyapti = true;
  tiklash();
  try{ await film(); } finally { ketyapti = false; }
}
$("play").addEventListener("click", ()=>{
  musiqa.boshla();
  $("ovoz").hidden = false;
  $("boshlash").classList.add("ket");
  setTimeout(()=>$("boshlash").hidden = true, 1000);
  ishga();
});
$("qayta").addEventListener("pointerdown", e=>e.stopPropagation());
$("qayta").addEventListener("click", ()=>{ musiqa.qayta(); ishga(); });
</script>
