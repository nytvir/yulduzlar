<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FFCBD9">
<meta property="og:title" content="Bitta savol">
<meta property="og:description" content="Ochib ko'r — bitta tugma bosishing kerak.">
<meta property="og:type" content="website">
<style>
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  *,*::before,*::after{box-sizing:border-box}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Meni yaxshi ko'rasanmi?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@500;700&display=swap">
<style>
  :root{
    --krem:#FFF4EF;
    --pushti:#FFD8E0;
    --pushti-2:#FFBFCD;
    --atir:#FF8AA0;
    --gul:#E14B68;
    --gul-toq:#B82F4E;
    --siyoh:#4A2030;
    --xira:#9C7180;
    --oq:#FFFFFF;
    --display:"Fraunces",Georgia,"Times New Roman",serif;
    --qol:"Caveat","Bradley Hand",cursive;
    --matn:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  html{box-sizing:border-box}
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(120% 90% at 50% 8%, #FFF8F4 0%, #FFE6EC 42%, #FFCBD9 74%, #FFB9CC 100%);
    color:var(--siyoh);font-family:var(--matn);
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  #fon{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

  .sahifa{
    position:relative;z-index:1;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;padding-block:32px;padding-inline:16px;text-align:center;
  }

  /* ── savol ── */
  .savol{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:560px}
  .yorliq{
    font-size:11px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--xira);font-weight:700;
  }
  h1{
    margin:0;font-family:var(--display);font-weight:600;
    font-size:clamp(34px,9.2vw,60px);line-height:1.08;letter-spacing:-.01em;
    color:var(--siyoh);text-wrap:balance;
  }
  .shubha{
    min-height:1.4em;margin:0;font-family:var(--qol);
    font-size:clamp(19px,4.6vw,25px);color:var(--gul);
    opacity:0;transition:opacity .4s ease;
  }
  .shubha.bor{opacity:.9}

  /* ── tugmalar ── */
  .tugmalar{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
  .tug{
    font-family:var(--matn);font-weight:700;font-size:17px;letter-spacing:.01em;
    border:none;border-radius:999px;padding:17px 44px;cursor:pointer;
    transition:transform .22s cubic-bezier(.2,1.4,.4,1),box-shadow .22s ease;
    -webkit-tap-highlight-color:transparent;
  }
  #ha{
    color:var(--oq);
    background:linear-gradient(165deg,var(--atir),var(--gul));
    box-shadow:0 12px 30px rgba(225,75,104,.34),0 1px 0 rgba(255,255,255,.45) inset;
  }
  #ha:hover{transform:translateY(-3px) scale(var(--o,1));box-shadow:0 18px 40px rgba(225,75,104,.42),0 1px 0 rgba(255,255,255,.45) inset}
  #ha:focus-visible{outline:3px solid var(--gul-toq);outline-offset:3px}
  .joy{display:inline-flex}
  #yoq{
    color:var(--gul-toq);background:rgba(255,255,255,.82);
    border:1.5px solid rgba(225,75,104,.26);
    box-shadow:0 6px 18px rgba(184,47,78,.12);
    transition:left .16s cubic-bezier(.2,1.5,.4,1),top .16s cubic-bezier(.2,1.5,.4,1),
               transform .16s ease,opacity .3s ease,padding .3s ease,font-size .3s ease;
  }
  #yoq.qochoq{position:fixed;z-index:9;margin:0}

  /* ── javob ── */
  .javob{
    position:fixed;inset:0;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;padding-block:32px;padding-inline:16px;text-align:center;
    background:radial-gradient(110% 80% at 50% 45%,rgba(255,247,244,.86) 0%,rgba(255,206,220,.9) 55%,rgba(255,181,203,.95) 100%);
    animation:kirish .7s cubic-bezier(.2,.8,.3,1) both;
  }
  .javob[hidden]{display:none!important}
  @keyframes kirish{from{opacity:0}to{opacity:1}}
  .muah{
    margin:0;font-family:var(--qol);font-weight:700;
    font-size:clamp(58px,17vw,120px);line-height:.94;color:var(--gul);
    text-shadow:0 6px 26px rgba(225,75,104,.28);
    animation:otil .85s cubic-bezier(.2,1.5,.35,1) both;
  }
  @keyframes otil{0%{opacity:0;transform:scale(.4) rotate(-7deg)}60%{opacity:1}100%{opacity:1;transform:scale(1) rotate(-2deg)}}
  .aslim{
    margin:0;font-family:var(--qol);font-weight:600;
    font-size:clamp(30px,8.4vw,54px);color:var(--gul-toq);
    animation:otil .85s .2s cubic-bezier(.2,1.5,.35,1) both;
  }
  .kichik{
    margin:14px 0 0;font-size:15px;line-height:1.7;color:var(--xira);max-width:30ch;
    animation:kirish .8s .9s both;
  }
  .qayta{
    margin-top:20px;font-family:var(--matn);font-size:13px;font-weight:500;
    color:var(--xira);background:transparent;border:1px solid rgba(156,113,128,.3);
    border-radius:999px;padding:10px 22px;cursor:pointer;
    animation:kirish .8s 1.2s both;
  }
  .qayta:hover{color:var(--gul);border-color:rgba(225,75,104,.4)}
  .qayta:focus-visible{outline:2px solid var(--gul);outline-offset:2px}

  @media (prefers-reduced-motion:reduce){
    .muah,.aslim,.kichik,.qayta,.javob{animation-duration:.01ms}
    .tug,#yoq{transition-duration:.01ms}
  }
</style>

</head>
<body>
<canvas id="fon"></canvas>

<div class="sahifa" id="sahifa">
  <div class="savol">
    <span class="yorliq">Bitta savol</span>
    <h1 id="matn">Meni yaxshi ko'rasanmi?</h1>
    <p class="shubha" id="shubha"></p>
  </div>
  <div class="tugmalar">
    <button class="tug" id="ha" type="button">Ha</button>
    <span class="joy" id="joy"><button class="tug" id="yoq" type="button">Yo'q</button></span>
  </div>
</div>

<div class="javob" id="javob" hidden>
  <p class="muah">Muahhh 😘</p>
  <p class="aslim" id="aslim">aslim!</p>
  <p class="kichik">Bilardim 😌 Endi bu sahifani yopsang ham bo'ladi — asosiysi aytildi.</p>
  <button class="qayta" id="qayta" type="button">Boshidan</button>
</div>

<script>
(function(){
  "use strict";

  /* ═══════════════════════════════════════════
     SHU YERNI O'ZGARTIRASAN
  ═══════════════════════════════════════════ */
  var ISM   = "Omina";              // bo'sh bo'lsa ism ishlatilmaydi
  var SAVOL = "Meni yaxshi ko'rasanmi?";
  var JAVOB = "aslim!";             // "Ha" bosilgandan keyingi ikkinchi qator

  // "Yo'q" har qochganda yozuvi o'zgaradi
  var YOQLAR = [
    "Yo'q", "Yo'q 🙄", "Rostdanmi?", "O'ylab ko'r", "Yana o'yla",
    "Bo'lmaydi", "Qo'yaver", "Bosolmaysan", "Charchamadingmi?",
    "Men tezman 😌", "Ha ni bos", "Mayli, tan oldim"
  ];
  var SHUBHALAR = {
    2:"hmm...", 4:"qochyapti-ku 😏", 6:"ushlay olmaysan",
    9:"tan ol endi", 12:"ha, bitta yo'l bor 😄"
  };

  /* ═══════════════════════════════════════════ */

  var sahifa=document.getElementById("sahifa");
  var yoq=document.getElementById("yoq");
  var joy=document.getElementById("joy");
  var ha=document.getElementById("ha");
  var shubha=document.getElementById("shubha");
  var javob=document.getElementById("javob");
  var fon=document.getElementById("fon");
  var g=fon.getContext("2d");
  var sekin=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var n=0, qochoq=false, ohirgiQoch=0;
  var W=0,H=0,DPR=1;
  var yuraklar=[], portlash=[];
  var vaqt=0, tugadi=false;

  /* ── ism ──────────────────────────────────── */
  (function ism(){
    var i=(ISM||"").trim();
    document.getElementById("matn").textContent = i ? (i+", meni yaxshi ko'rasanmi?") : SAVOL;
    document.getElementById("aslim").textContent = JAVOB;
    document.title = i ? (i+", meni yaxshi ko'rasanmi?") : SAVOL;
  })();

  /* ── kanvas ───────────────────────────────── */
  function olcham(){
    W=window.innerWidth; H=window.innerHeight;
    DPR=Math.min(window.devicePixelRatio||1,2);
    fon.width=Math.round(W*DPR); fon.height=Math.round(H*DPR);
    g.setTransform(DPR,0,0,DPR,0,0);
    if(!yuraklar.length) yurakYasa();
  }
  function yurakYasa(){
    yuraklar=[];
    var k=Math.round(Math.min(34, (W*H)/26000));
    if(sekin) k=Math.round(k*0.5);
    for(var i=0;i<k;i++) yuraklar.push(yangiYurak(true));
  }
  function yangiYurak(boshda){
    return {
      x:Math.random()*W,
      y: boshda ? Math.random()*H : H+30,
      s:0.7+Math.random()*2.1,
      v:14+Math.random()*30,
      b:(Math.random()-0.5)*0.9,
      f:Math.random()*6.283,
      a:0.10+Math.random()*0.30,
      c: Math.random()<0.28 ? "255,138,160" : (Math.random()<0.5 ? "255,191,205":"255,255,255")
    };
  }
  function yurakYol(x,y,s,rot,rang,alfa){
    g.save(); g.translate(x,y); g.rotate(rot); g.scale(s,s);
    g.globalAlpha=alfa; g.fillStyle="rgba("+rang+",1)";
    g.beginPath();
    g.moveTo(0,-2.6);
    g.bezierCurveTo(0,-5.4,-2,-7,-4.2,-7);
    g.bezierCurveTo(-7.8,-7,-8.2,-3.4,-8.2,-2.4);
    g.bezierCurveTo(-8.2,1.6,-4.2,5.2,0,8.2);
    g.bezierCurveTo(4.2,5.2,8.2,1.6,8.2,-2.4);
    g.bezierCurveTo(8.2,-3.4,7.8,-7,4.2,-7);
    g.bezierCurveTo(2,-7,0,-5.4,0,-2.6);
    g.closePath(); g.fill(); g.restore();
  }
  function otil(x,y,k,kuch){
    for(var i=0;i<k;i++){
      var a=Math.random()*6.283, v=(70+Math.random()*300)*(kuch||1);
      portlash.push({
        x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-90,
        s:0.7+Math.random()*2.4,rot:Math.random()*6.283,
        vr:(Math.random()-0.5)*7,um:1.5+Math.random()*1.4,m:2.6,
        c: Math.random()<0.4?"225,75,104":(Math.random()<0.5?"255,138,160":"255,255,255")
      });
    }
  }
  function kadr(t){
    var dt=Math.min(0.05,(t-vaqt)/1000||0); vaqt=t;
    g.clearRect(0,0,W,H);

    for(var i=0;i<yuraklar.length;i++){
      var h=yuraklar[i];
      h.y-=h.v*dt; h.f+=dt*0.8;
      h.x+=Math.sin(h.f)*9*dt;
      if(h.y<-40){ yuraklar[i]=yangiYurak(false); continue; }
      yurakYol(h.x,h.y,h.s,Math.sin(h.f)*0.22+h.b*0.3,h.c,h.a);
    }
    for(var k=portlash.length-1;k>=0;k--){
      var p=portlash[k];
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=260*dt;
      p.vx*=Math.pow(0.5,dt); p.rot+=p.vr*dt; p.um-=dt;
      if(p.um<=0||p.y>H+60){ portlash.splice(k,1); continue; }
      yurakYol(p.x,p.y,p.s,p.rot,p.c,Math.max(0,Math.min(1,p.um/1.2))*0.92);
    }
    g.globalAlpha=1;
    requestAnimationFrame(kadr);
  }

  /* ── "Yo'q" qochadi ───────────────────────── */
  function qoch(ev){
    if(tugadi) return;
    if(ev){ ev.preventDefault(); ev.stopPropagation(); }
    var endi=performance.now();
    if(endi-ohirgiQoch<90) return;
    ohirgiQoch=endi;

    var r=yoq.getBoundingClientRect();
    if(!qochoq){
      joy.style.width=r.width+"px"; joy.style.height=r.height+"px";
      yoq.classList.add("qochoq");
      yoq.style.left=r.left+"px"; yoq.style.top=r.top+"px";
      qochoq=true;
    }

    n++;
    yoq.textContent = YOQLAR[Math.min(n, YOQLAR.length-1)];
    if(SHUBHALAR[n]){ shubha.textContent=SHUBHALAR[n]; shubha.classList.add("bor"); }

    // "Ha" kattalashadi, "Yo'q" kichrayadi
    var o=1+Math.min(n*0.055,0.5);
    ha.style.setProperty("--o",o);
    ha.style.transform="scale("+o+")";
    var kch=Math.max(0.62,1-n*0.038);
    yoq.style.fontSize=(17*kch)+"px";
    yoq.style.padding=(17*kch)+"px "+(44*kch)+"px";
    yoq.style.opacity=Math.max(0.42,1-n*0.05);

    // yangi joy
    var w=r.width, h=r.height, chet=14;
    var hr=ha.getBoundingClientRect();
    var hx=hr.left+hr.width/2, hy=hr.top+hr.height/2;
    var mx=(ev&&ev.clientX!=null)?ev.clientX:r.left+w/2;
    var my=(ev&&ev.clientY!=null)?ev.clientY:r.top+h/2;
    var eng=null, engM=-1;
    for(var i=0;i<40;i++){
      var x=chet+Math.random()*Math.max(1,W-w-chet*2);
      var y=chet+Math.random()*Math.max(1,H-h-chet*2);
      var cx=x+w/2, cy=y+h/2;
      var dM=Math.hypot(cx-mx,cy-my);
      var dH=Math.hypot(cx-hx,cy-hy);
      if(dM>Math.min(180,W*0.32) && dH>Math.min(150,W*0.3)){ eng={x:x,y:y}; break; }
      var ball=Math.min(dM,dH*0.8);
      if(ball>engM){ engM=ball; eng={x:x,y:y}; }
    }
    yoq.style.left=eng.x+"px"; yoq.style.top=eng.y+"px";
    yoq.style.transform="rotate("+((Math.random()-0.5)*16).toFixed(1)+"deg)";
  }

  ["pointerenter","pointerover","pointerdown","mouseenter","touchstart","click","focus"]
    .forEach(function(e){ yoq.addEventListener(e, qoch, {passive:false}); });

  window.addEventListener("pointermove", function(e){
    if(tugadi||!qochoq) return;
    var r=yoq.getBoundingClientRect();
    var d=Math.hypot(e.clientX-(r.left+r.width/2), e.clientY-(r.top+r.height/2));
    if(d<Math.max(80,r.width*0.9)) qoch(e);
  }, {passive:true});

  /* ── "Ha" ─────────────────────────────────── */
  function chalgi(){
    try{
      var K=window.AudioContext||window.webkitAudioContext; if(!K) return;
      var ac=new K(), t=ac.currentTime;
      [0,4,7,12,16].forEach(function(s,i){
        var o=ac.createOscillator(), gg=ac.createGain();
        o.type="sine"; o.frequency.value=523.25*Math.pow(2,s/12);
        gg.gain.setValueAtTime(0.0001,t+i*0.085);
        gg.gain.exponentialRampToValueAtTime(0.16,t+i*0.085+0.012);
        gg.gain.exponentialRampToValueAtTime(0.0001,t+i*0.085+0.85);
        o.connect(gg); gg.connect(ac.destination);
        o.start(t+i*0.085); o.stop(t+i*0.085+0.9);
      });
      setTimeout(function(){ try{ac.close();}catch(e){} }, 3000);
    }catch(e){}
  }
  ha.addEventListener("click", function(){
    if(tugadi) return;
    tugadi=true;
    var r=ha.getBoundingClientRect();
    otil(r.left+r.width/2, r.top+r.height/2, sekin?30:110, 1);
    setTimeout(function(){ otil(W*0.25,H*0.5,sekin?20:70,0.9); },160);
    setTimeout(function(){ otil(W*0.75,H*0.5,sekin?20:70,0.9); },300);
    setTimeout(function(){ otil(W*0.5,H*0.32,sekin?20:80,1.1); },460);
    chalgi();
    sahifa.style.transition="opacity .45s ease,transform .45s ease";
    sahifa.style.opacity="0"; sahifa.style.transform="scale(.94)";
    yoq.style.opacity="0";
    setTimeout(function(){ sahifa.hidden=true; javob.hidden=false; },420);
  });

  document.getElementById("qayta").addEventListener("click", function(){
    tugadi=false; n=0; qochoq=false; portlash.length=0;
    yoq.className="tug"; yoq.removeAttribute("style"); yoq.textContent=YOQLAR[0];
    joy.removeAttribute("style");
    ha.removeAttribute("style");
    shubha.textContent=""; shubha.classList.remove("bor");
    javob.hidden=true; sahifa.hidden=false;
    sahifa.style.opacity="1"; sahifa.style.transform="none";
  });

  window.addEventListener("resize", function(){
    olcham();
    if(qochoq){
      var r=yoq.getBoundingClientRect();
      yoq.style.left=Math.min(parseFloat(yoq.style.left)||0, Math.max(0,W-r.width-14))+"px";
      yoq.style.top =Math.min(parseFloat(yoq.style.top)||0,  Math.max(0,H-r.height-14))+"px";
    }
  });

  olcham();
  requestAnimationFrame(function(t){ vaqt=t; kadr(t); });
})();
</script>

</body>
</html>
